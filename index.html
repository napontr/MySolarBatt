     โหลดไม่ได้ (ออฟไลน์) ก็ตกไปใช้ฟอนต์ระบบ ไม่กระทบการทำงาน -->

<style>
/* ===================================================================
   สี: ชุด categorical ที่ผ่าน validator ของ skill dataviz แล้ว
   node scripts/validate_palette.js "#eda100,#1baf7a,#e34948" --mode light  -> PASS
   node scripts/validate_palette.js "#c98500,#199e70,#e66767" --mode dark   -> PASS
   node scripts/validate_palette.js "#2a78d6,#1baf7a,#4a3aa7" ทั้ง 2 โหมด   -> PASS
   คู่ที่อยู่ใน warn band (แดง<->เขียว CVD 6.5-6.9) ใช้ได้เพราะมี secondary
   encoding ครบ: ป้ายตัวเลขติดบนแท่ง + legend + ตารางข้อมูล
   🔴 ห้ามสลับสีตามอันดับ/ตามลำดับที่มาก่อนหลัง — สีผูกกับ "ของสิ่งนั้น" ถาวร

   2026-11-19 ชุด "หน้าปัดนาฬิกา" (Napon ขอให้หรูขึ้น · layout เดิมทั้งหมด)
   สว่าง = หน้าปัดกระเบื้องขาวเย็น หมึกน้ำเงินเข้ม · มืด = หน้าปัดกลางคืน น้ำเงินลึก ตัวเลขสีงาช้าง
   --brass = สีทองเหลืองของตัวเรือน ใช้กับ "กรอบ/สถานะเลือก" เท่านั้น ไม่ใช้กับข้อมูล
   สีข้อมูลโหมดสว่างคงชุดเดิมที่ผ่าน validator · โหมดมืดยกความสว่างขึ้นเพราะพื้นเปลี่ยนเป็นน้ำเงิน
   contrast (WCAG) คำนวณแล้ว: --muted บน surface 5.2:1 (สว่าง) / 6.5:1 (มืด) · ink 17:1 / 16:1
   =================================================================== */
:root{
  color-scheme: light;
  --plane:#eceef2; --surface:#ffffff; --surface-2:#f3f4f7;
  --ink:#151a2d; --ink-2:#454b62; --muted:#61677d;
  --line:#e3e6ec; --axis:#c5cad6; --ring:rgba(21,26,45,.09);
  --brass:#86631f; --brass-soft:rgba(178,138,62,.32);
  --solar:#eda100; --batt:#1baf7a; --grid:#e34948; --home:#2a78d6; --export:#4a3aa7;
  --good:#13924f; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --tnum-mix:65%;   /* ตัวเลขสีในการ์ด: ผสมหมึกเข้มให้ผ่าน contrast บนพื้นขาว */
  --shadow:0 1px 1px rgba(21,26,45,.04), 0 2px 4px rgba(21,26,45,.04), 0 14px 32px -14px rgba(21,26,45,.18);
  --hi:inset 0 1px 0 rgba(255,255,255,.9);
  --glow:rgba(237,161,0,.10);
  /* 2026-11-22 ถอดตัวแปรพื้นไล่สี/ไอคอนจาง (--gl-* · --wm-* · --muted-tint) ของ v3.16.0 ออก */
  --track:#d3d8e2; --strip-buy:#c4cad6; --strip-empty:#e2e5ec;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#070b16; --surface:#0f1526; --surface-2:#172038;
    --ink:#f4efe4; --ink-2:#c9c4b8; --muted:#949bb0;
    --line:#1f2842; --axis:#2e3956; --ring:rgba(214,179,110,.13);
    --brass:#d6b36e; --brass-soft:rgba(214,179,110,.30);
    --solar:#d9a21f; --batt:#22ad7d; --grid:#ec6b6b; --home:#4b93ec; --export:#9b91ee;
    --good:#34b86e;
    --tnum-mix:78%;
    --shadow:0 20px 40px -24px rgba(0,0,0,.8);
    --hi:inset 0 1px 0 rgba(255,255,255,.045);
    --glow:rgba(214,179,110,.09);
    --track:#070b16; --strip-buy:#34405f; --strip-empty:#080c18;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#070b16; --surface:#0f1526; --surface-2:#172038;
  --ink:#f4efe4; --ink-2:#c9c4b8; --muted:#949bb0;
  --line:#1f2842; --axis:#2e3956; --ring:rgba(214,179,110,.13);
  --brass:#d6b36e; --brass-soft:rgba(214,179,110,.30);
  --solar:#d9a21f; --batt:#22ad7d; --grid:#ec6b6b; --home:#4b93ec; --export:#9b91ee;
  --good:#34b86e;
  --tnum-mix:78%;
  --shadow:0 20px 40px -24px rgba(0,0,0,.8);
  --hi:inset 0 1px 0 rgba(255,255,255,.045);
  --glow:rgba(214,179,110,.09);
  --track:#070b16; --strip-buy:#34405f; --strip-empty:#080c18;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--plane);color:var(--ink);
  font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  -webkit-font-smoothing:antialiased}
/* แสงเช้าจาง ๆ ที่ขอบบน — ชั้นเดียว ไม่ขยับ */
body{background:radial-gradient(900px 420px at 50% -220px,var(--glow),transparent 70%) no-repeat,var(--plane)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
/* ตัวเลขเด่นจุดเดียวของหน้า (เลขบ้าน + SOC ในวงแหวน) ใช้ Fraunces · ที่เหลือ Plex ทั้งหมด */
header .bt b,.ring .val b{font-family:"Fraunces","IBM Plex Sans Thai",Georgia,serif;font-optical-sizing:auto}
body{display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
.app{width:100%;max-width:480px;padding:10px 12px 60px}   /* 2026-09-22 บีบให้พอดีจอ S24U */

/* ---------- chrome ---------- */
header{display:flex;align-items:center;gap:10px;padding:2px 2px 7px}
/* 2026-09-23 หัวจอแบบ A (Napon เลือก): กล่องไอคอนแดด + เลขบ้าน 2 บรรทัด
   สีไอคอนใช้ --solar ตัวเดียวกับ "แดด" ในผังไฟ ⇒ ไม่เพิ่มสีใหม่เข้าระบบ · สูง 34px ≈ ปุ่ม 32px ไม่ดันการ์ดลง */
header h1{margin:0;display:flex;align-items:center;gap:9px;white-space:nowrap;min-width:0}
header .logo{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  color:var(--solar);
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--solar) 22%,var(--surface)),var(--surface) 75%);
  box-shadow:inset 0 0 0 1px var(--brass-soft),0 0 0 3px color-mix(in srgb,var(--brass) 8%,transparent)}
header .logo svg{width:20px;height:20px}
header .bt{display:flex;flex-direction:column;line-height:1.05}
header .bt b{font-size:19px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
header .bt small{font-size:9.5px;font-weight:600;letter-spacing:.16em;color:var(--brass);margin-top:3px}
header .stamp{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.35}
/* 2026-09-22 แคปซูลสถานะ (Napon สั่ง) — เดิมบอกออฟไลน์ด้วยข้อความสีส้มลอย ๆ อ่านผ่านตาได้ง่าย
   จุดกลม + พื้นสีอ่อน ทำให้เห็นสถานะก่อนอ่านตัวหนังสือ · จุดกะพริบเฉพาะตอน Online */
.spill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  padding:2px 9px 2px 7px;border-radius:999px;letter-spacing:.02em;
  background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc)}
.spill i{width:6px;height:6px;border-radius:50%;background:var(--sc);flex-shrink:0}
.spill.on{--sc:var(--good)}
.spill.on i{animation:none}   /* 2026-11-22 เลิกกะพริบ — สีเขียวบอกสถานะพอแล้ว ของขยับดึงสายตาจากตัวเลข */
.spill.off{--sc:var(--warn)}
.spill.wait{--sc:var(--muted)}
@keyframes spdot{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){ .spill.on i{animation:none} }
.iconbtn{border:1px solid var(--ring);background:var(--surface);color:var(--ink-2);
  width:38px;height:38px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;
  box-shadow:var(--hi);transition:color .2s,border-color .2s,transform .12s}
.iconbtn:hover{color:var(--brass);border-color:var(--brass-soft)}
.iconbtn:active{transform:scale(.94)}
/* 2026-09-22 ปุ่มรีเฟรช (Napon สั่ง) — หมุนระหว่างรอ ไม่งั้นกดแล้วไม่รู้ว่าติดหรือเปล่า
   ปุ่มที่กดแล้วเงียบ = คนกดซ้ำ ซึ่งเปลืองโควตา GAS ที่ตึงอยู่แล้ว */
.iconbtn.busy{animation:btnspin .9s linear infinite;pointer-events:none;opacity:.6}
@keyframes btnspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .iconbtn.busy{animation:none} }

.card{background:var(--surface);border:1px solid var(--ring);border-radius:18px;
  padding:14px 15px;margin-bottom:12px;box-shadow:var(--hi),var(--shadow)}   /* 2026-11-22 padding 12/13→14/15 ให้หายใจ */
.card h2{font-size:14.5px;font-weight:600;color:var(--ink);margin:0 0 3px;
  letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.card h2 .badge{margin-left:auto;font-size:10px;font-weight:500;padding:2px 8px;
  border-radius:999px;background:transparent;color:var(--brass);
  box-shadow:inset 0 0 0 1px var(--brass-soft)}
.card .why{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.5}

/* ---------- tabs ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;
  background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--ring);z-index:20;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs .inner{display:flex;width:100%;max-width:480px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px 2px 11px;
  font-size:11.5px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-family:inherit;position:relative;transition:color .2s}
.tabs button .g{font-size:17px;line-height:1;transition:transform .2s}
/* แท็บที่เลือก = ขีดทองเหลืองบนขอบ (เหมือนเข็มชี้) */
.tabs button::before{content:"";position:absolute;top:-1px;left:50%;width:0;height:2px;
  border-radius:0 0 2px 2px;background:var(--brass);transform:translateX(-50%);transition:width .25s ease}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
.tabs button[aria-selected="true"]::before{width:28px}
/* 2026-11-22 แท็บที่เลือกมีพื้นแคปซูลจาง ๆ หลังไอคอน — ขีดทอง 2px อย่างเดียวมองไม่ค่อยเห็นบนมือถือ */
.tabs button .g{padding:3px 14px;border-radius:999px}   /* ไม่ใส่ transition ที่นี่ — จะทับกฎ reduced-motion ข้างบน */
.tabs button[aria-selected="true"] .g{background:color-mix(in srgb,var(--brass) 16%,transparent)}
.tabs button[aria-selected="true"] .g{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){ .tabs button::before,.tabs button .g{transition:none} }

/* ---------- hero ---------- */
/* 2026-09-22 รอบ 2: 3 คอลัมน์ "กว้างเท่ากัน" ตามที่ Napon สั่งให้สมมาตร
   ของเดิมคอลัมน์ซ้ายเป็น auto (กว้างตามโดนัท) ทำให้ 3 ช่องไม่เท่ากัน */
.hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:stretch}
/* ทุกกล่องในแถบบน: ป้าย/ตัวเลข/ไอคอน จัดกึ่งกลางทั้งแนวตั้งและแนวนอน · ป้ายเป็นตัวหนา */
.hero .tile{align-items:center;text-align:center}
.hero .tile .l{font-weight:700;color:var(--ink-2)}
.hero .tile .v,.hero .tile .s{width:100%}
/* 2026-09-22 กล่อง Battery เล็กลง + ย้ายการ์ด ผลิตแล้ว/ซื้อไฟแล้ว มาอยู่ขวามือ (Napon สั่ง) */
/* 3 คอลัมน์: ซ้าย = Battery+โดนัท · กลาง = ชาร์จ/จ่าย · ขวา = ผลิตแล้ว/ซื้อไฟแล้ว
   สัดส่วนตามสเก็ตช์ที่ Napon ส่งมา (37% / 26% / 27%) */
.heroL{display:flex;flex-direction:column;align-items:center;justify-content:center}
/* 2026-09-22 ขยายตัวอักษรส่วนบนทั้งแถบ (Napon สั่ง) — ของเดิมเล็กไปเมื่อเทียบกับการ์ดล่าง */
.ringWrap{text-align:center}
.ringWrap .mx{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.heroR{min-width:0;display:grid;grid-template-rows:1fr 1fr;gap:8px}
.heroR .tile{display:flex;flex-direction:column;justify-content:center;padding:7px 9px}
.heroR .tile .l{font-size:12px}
.heroR .tile .v{font-size:22px}
.heroR .tile .v u{font-size:11px}
.heroR .tile .s{font-size:11px}
/* กล่องกลางสูงเต็มแถว — เขียว = ไฟเข้าแบต · แดง = ดึงออกจากแบต (สีชุดเดียวกับผังไฟวิ่ง) */
.hero > .tile.tb{min-width:0;box-sizing:border-box;display:flex;flex-direction:column;
  justify-content:center;padding:7px 9px}
.tile.tb .l{white-space:normal;font-size:12px}
.tile.tb .v{font-size:clamp(22px,6.4vw,30px);letter-spacing:-.035em}   /* 2026-11-19 31→clamp: Plex กว้างกว่าฟอนต์ระบบ "1,850 W" ล้นกล่องที่ 390px */
.tile.tb .v u{font-size:12px}
.tile.tb .s{color:var(--tc);margin-top:3px;font-size:11.5px}
.tile.tb .bsign{font-size:15px;font-weight:700}

/* ---------- ไอคอนแบตในกล่องชาร์จ/จ่าย ----------
   ระดับไฟในไอคอน = SOC จริง · ลูกศรวิ่งเข้า/ออกตามเครื่องหมายของ batt
   ความเร็วผูกกับกำลังไฟผ่าน --sp เหมือนผังไฟวิ่ง ⇒ 2 ที่ในหน้าเดียวเล่าเรื่องเดียวกัน */
.bchip{display:block;width:100%;max-width:104px;height:auto;margin:4px auto 5px}
.bchev{animation:bchevOut var(--sp,1.3s) linear infinite}
.bchip.in .bchev{animation-name:bchevIn}
.bchev:nth-of-type(2){animation-delay:calc(var(--sp,1.3s) * .33)}
.bchev:nth-of-type(3){animation-delay:calc(var(--sp,1.3s) * .66)}
@keyframes bchevOut{0%{opacity:0;transform:translateX(-7px)}
                    40%{opacity:1}100%{opacity:0;transform:translateX(9px)}}
@keyframes bchevIn {0%{opacity:0;transform:translateX(9px)}
                    40%{opacity:1}100%{opacity:0;transform:translateX(-7px)}}
@media (prefers-reduced-motion:reduce){
  .bchev{animation:none;opacity:.85}   /* ลูกศรยังชี้ทิศอยู่ แค่ไม่วิ่ง */
}
.ring{width:132px;height:132px;flex-shrink:0;position:relative}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring .val .rname{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1;margin-bottom:2px}
.ring .val b{font-size:42px;font-weight:500;line-height:1;letter-spacing:-.03em;font-variant-numeric:lining-nums}
.ring .val b .pc{font-size:18px;font-weight:500;color:inherit;opacity:.7;margin-left:1px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:4px 11px;border-radius:999px}
.hero .meta{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:6px}
.hero .meta b{font-variant-numeric:tabular-nums}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.c3{grid-template-columns:1fr 1fr 1fr}
.tile{background:var(--surface-2);border-radius:13px;padding:9px 11px;min-width:0;
  box-shadow:inset 0 0 0 1px var(--ring)}
.tile .l{font-size:12px;color:var(--muted);margin-bottom:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .v u{font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;margin-left:2px}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* สีการ์ดตาม "ความหมาย" ไม่ใช่ตามลำดับ — ใช้สีชุดเดียวกับผังไฟ ⇒ เหลืองในกราฟ = เหลืองในการ์ด = แดด
   🔴 ห้ามสลับสีตามตำแหน่ง/อันดับ · สีผูกกับความหมายถาวร (กฎเดียวกับหัวไฟล์)
   ตัวเลขเป็น 19px ตัวหนา = large text ⇒ เกณฑ์ contrast 3:1 ไม่ใช่ 4.5:1 · ป้ายกับหมายเหตุยังเป็น --muted เหมือนเดิม */
/* 2026-11-19 เลขสีผสมหมึก (--tnum-mix) ให้อ่านง่ายบนพื้นไล่สี */
.tile.t .v{color:color-mix(in srgb,var(--tc) var(--tnum-mix),var(--ink))}
.t-good{--tc:var(--batt)}    /* เขียว — ไม่ต้องซื้อไฟ · ประหยัดได้ · มูลค่าที่ได้คืน */
.t-gen {--tc:var(--solar)}   /* เหลือง — การผลิต */
.t-self{--tc:var(--home)}    /* น้ำเงิน — พึ่งตัวเอง (%) · 2026-11-22 ยอดผลิตย้ายไปเหลืองแล้ว */
.t-cost{--tc:var(--grid)}    /* แดง — ซื้อไฟ · ค่าไฟ */

/* ---------- ชุด "หน้าปัดสงบ" (2026-11-22 · Napon เลือกแบบผสม หลังปรึกษา Codex) ----------
   ถอดพื้นไล่สี + ไอคอนจางของ v3.16.0 ออกทั้งชุด — ทุกการ์ดตะโกนเท่ากันจนไม่มีจุดเด่น
   สีเหลือแค่ 2 ที่: ตัวเลข (.tile.t .v) กับจุดหน้าป้าย (.tile.t .l::before) ⇒ สีบอก "ความหมาย" ไม่ใช่ตกแต่ง
   จุดเด่นจุดเดียวของหน้า = การ์ดแบต (กรอบทองเหลืองบาง ๆ) · ย้อนกลับ: archive\index-20261122-pre-calm.html */
.tile.t .l::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--tc);margin-right:5px;vertical-align:1px}
.hero .tile.t .l::before{display:none}   /* แถบบนจัดกึ่งกลาง จุดทำให้ป้ายเยื้อง */
.card:has(.hero){box-shadow:var(--hi),inset 0 0 0 1px var(--brass-soft),var(--shadow)}

/* (v3.16.0) ร่องแทร็กให้เข้มกว่าการ์ด — ยังเก็บไว้หลังถอดพื้นไล่สี เพราะร่องชัดกว่า --line เดิม
   เดิม: ร่องแทร็กกลืนกับพื้นไล่สี ⇒ ทำให้เข้มกว่าการ์ด (override ตัวแปรในขอบเขต ไม่แตะ JS)
   วงแหวน SOC ใช้ var(--line) · แถบ 24 ชม. ใช้ --line (ซื้อไฟ/นิ่ง) กับ --surface-2 (ยังไม่มีข้อมูล) ทั้งในแถบและ legend */
.ring{--line:var(--track)}
.card:has(.strip){--line:var(--strip-buy);--surface-2:var(--strip-empty)}

/* ---------- flow ---------- */
.flow{display:flex;align-items:stretch;gap:8px;margin-top:4px}
.node{flex:1;background:var(--surface-2);border-radius:12px;padding:9px 8px;text-align:center}
.node .n{font-size:12px;color:var(--muted)}
.node .w{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.node .w u{font-size:9px;color:var(--muted);text-decoration:none}
.arrow{display:flex;align-items:center;color:var(--muted);font-size:13px}

/* ---------- power flow — ไฟวิ่งตามทิศจริง ----------
   เส้นจาง = เส้นทางที่มีอยู่ · เส้นประวิ่ง = มีไฟไหลอยู่จริงตอนนี้
   ทิศวิ่ง = ทิศของ path (จุดเริ่ม -> จุดจบ) ⇒ โค้ดสลับต้น/ปลายตามเครื่องหมายของค่า
   ความเร็ว = ผูกกับกำลังไฟจริงผ่าน --sp (ยิ่งเยอะยิ่งเร็ว) ไม่ใช่ความเร็วคงที่ */
.pflow svg{display:block;width:100%;max-width:372px;margin:0 auto;height:auto;overflow:visible}
.pf-line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.22}
.pf-dash{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 14;
  animation:pfrun var(--sp,1.6s) linear infinite}
@keyframes pfrun{to{stroke-dashoffset:-22}}
.pf-node{fill:var(--surface-2);stroke:var(--brass-soft);stroke-width:1}
.pf-lab{font-size:13px;fill:var(--muted)}
.pf-val{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pf-u{font-size:11.5px;fill:var(--muted);font-weight:400}
.pf-rays{transform-box:fill-box;transform-origin:center}   /* 2026-11-22 เลิกหมุน — เก็บแค่เส้นไฟวิ่งที่บอกทิศจริง */
@keyframes pfspin{to{transform:rotate(360deg)}}
.pf-off{opacity:.6}   /* 2026-11-22 .34→.6: 0 W ก็ยังต้องอ่านออก */
/* เคารพคนที่ปิดแอนิเมชันในระบบ — เส้นประยังอยู่ แค่ไม่วิ่ง จึงยังอ่านออกว่าเส้นไหนมีไฟ */
@media (prefers-reduced-motion:reduce){
  .pf-dash,.pf-rays{animation:none}
  .pf-dash{opacity:.9}
}

/* ---------- แถบ 24 ชั่วโมง (2026-09-22 Napon สั่ง) ----------
   เขียว = ชาร์จเข้าแบต · ส้ม = ดึงไฟจากแบต · ไม่ลงสี = ซื้อไฟ/นิ่ง (ตามที่สั่ง)
   สีเขียว/ส้ม ยืมโทนจากชุดเดิมของแอป ไม่ได้เพิ่มสีใหม่เข้าจาน */
.strip svg{display:block;width:100%;height:auto}
.strip .hr{font-size:10.5px;fill:var(--muted)}
.stripLeg{display:flex;gap:12px;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--ink-2)}
.stripLeg span{display:inline-flex;align-items:center;gap:5px}
.stripLeg i{width:10px;height:10px;border-radius:2.5px;flex-shrink:0}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);
  border:1px solid var(--brass-soft);border-radius:10px;padding:6px 10px;font-size:11px;
  box-shadow:0 10px 28px -10px rgba(7,11,22,.35);z-index:5;opacity:0;transition:opacity .1s;
  white-space:nowrap;line-height:1.6}
.tip.on{opacity:1}
.tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 13px;font-size:12px;color:var(--ink-2);margin-top:9px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;
  vertical-align:-1px;font-style:normal}

/* ---------- balance bars ---------- */
.bal{margin-top:11px}
.bal .row{margin-bottom:11px}
.bal .cap{display:flex;font-size:12px;color:var(--muted);margin-bottom:5px}
.bal .cap b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.bal .track{display:flex;height:30px;gap:2px;border-radius:7px;overflow:hidden}
.bal .seg{display:flex;align-items:center;justify-content:center;font-size:10.5px;
  font-weight:600;color:#fff;min-width:2px;overflow:hidden;white-space:nowrap}
.bal .seg.dim{background:var(--line)!important;color:var(--ink-2)}

/* ---------- misc ---------- */
.recon{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);
  background:var(--surface-2);border-radius:9px;padding:7px 10px;margin-top:10px;line-height:1.5}
.recon .st{font-weight:700;flex-shrink:0}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:9px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11px}
th:first-child,td:first-child{text-align:left}
details>summary{font-size:11px;color:var(--ink-2);cursor:pointer;padding:7px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}
details[open]>summary::before{content:"▾ "}
.field{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12px}
.field label{flex:1;color:var(--ink-2)}
.field input,.field select{width:112px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--ring);border-radius:9px;padding:6px 9px;font-size:12px;
  font-family:inherit;text-align:right}
.field input.wide{width:100%;text-align:left;font-size:11px}
.seg-ctl{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:11px}
.seg-ctl button{flex:1;border:0;background:none;color:var(--ink-2);font-family:inherit;
  font-size:11.5px;padding:7px 2px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg-ctl button{transition:color .2s,background-color .2s}
.seg-ctl button.on{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:inset 0 0 0 1px var(--brass-soft),0 1px 2px rgba(7,11,22,.10)}
.btn{border:1px solid var(--ring);background:var(--surface-2);color:var(--ink);
  font-family:inherit;font-size:12px;padding:9px 14px;border-radius:11px;cursor:pointer;
  margin:0 8px 8px 0;transition:border-color .2s,transform .12s}
.btn:hover{border-color:var(--brass-soft)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.empty{font-size:12px;color:var(--muted);text-align:center;padding:22px 8px;line-height:1.7}
.err{color:var(--crit);font-size:12px;line-height:1.7;word-break:break-word}
.skel{height:13px;border-radius:5px;background:var(--surface-2);animation:p 1.3s infinite}
@keyframes p{50%{opacity:.45}}

/* ===================================================================
   2026-11-22 v3.18.0 ชุด "Boreal Observatory" (Napon เลือกแบบ 5 จาก mockup ของ Codex)
   กระจกควัน + แสงออโรราเขียวหยก + เส้นเครื่องมือบาง ๆ · บล็อกนี้วาง "ท้ายสุด" ⇒ ทับค่าข้างบนทั้งหมด
   palette จาก Codex `docs\design-codex-20261122-hitech\directions-2.md` แบบ 5 ยกเว้น 2 จุด:
     --home มืด #BCD8D4 (สเปก) ไม่ใช่สีส้มอย่างใน prototype — ส้มชนกับ --solar ในกราฟ "แดดผลิต vs บ้านใช้"
     --brass ใช้เป็น "สีหยกประจำแบรนด์" (ชื่อตัวแปรเดิม เพื่อไม่ต้องไล่แก้ทุก selector)
   ย้อนกลับ: archive\index-20261122-pre-boreal.html
   =================================================================== */
:root{
  --plane:#EEF2EB; --surface:#FFFFFF; --surface-2:#f2f6f1;
  --ink:#20312C; --ink-2:#3d524b; --muted:#5a6d66;
  --line:#dce5df; --axis:#c2cec7; --ring:rgba(32,49,44,.11); --hair:rgba(32,49,44,.28);
  --brass:#386653; --brass-soft:rgba(56,102,83,.30);
  --solar:#c27a0e; --batt:#178a46; --batt-dis:#e0521a; --grid:#c23b30; --home:#2f6f69; --export:#5b49c4;
  --good:#178a46; --serious:#e0521a; --pearl:#ffffff;
  --orb-hi:#ffffff; --orb-lo:#e3ebe5;
  --glow:rgba(56,102,83,.10);
  --aurora:rgba(56,102,83,.10);
  --shadow:0 1px 2px rgba(32,49,44,.05),0 16px 32px -18px rgba(32,49,44,.25);
  --hi:inset 0 1px 0 rgba(255,255,255,.9);
  --track:#d6e0d9; --strip-buy:#c9d4cd; --strip-empty:#e8eee9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#0d1112; --surface:#172420; --surface-2:#1f2f2a;
    --ink:#EDF1E8; --ink-2:#c6d1ca; --muted:#93a59c;
    --line:#26362f; --axis:#33463f; --ring:rgba(205,220,214,.14); --hair:rgba(220,232,226,.38);
    --brass:#8ECDB4; --brass-soft:rgba(142,205,180,.35);
    --solar:#F2B04F; --batt:#2FD27A; --batt-dis:#FF6B2C; --grid:#F2685C; --home:#9FDCD4; --export:#a99cf5;
    --good:#2FD27A; --serious:#FF6B2C; --pearl:#f4efe4;
    --orb-hi:#2c3e39; --orb-lo:#101917;
    --glow:rgba(142,205,180,.12); --aurora:rgba(142,205,180,.16);
    --shadow:0 24px 40px -24px rgba(0,0,0,.85);
    --hi:inset 0 1px 0 rgba(255,255,255,.05);
    --track:#0e1714; --strip-buy:#3a4a44; --strip-empty:#111a17;
  }
}
:root[data-theme="dark"]{
  --plane:#0d1112; --surface:#172420; --surface-2:#1f2f2a;
  --ink:#EDF1E8; --ink-2:#c6d1ca; --muted:#93a59c;
  --line:#26362f; --axis:#33463f; --ring:rgba(205,220,214,.14); --hair:rgba(220,232,226,.38);
  --brass:#8ECDB4; --brass-soft:rgba(142,205,180,.35);
  --solar:#F2B04F; --batt:#2FD27A; --batt-dis:#FF6B2C; --grid:#F2685C; --home:#9FDCD4; --export:#a99cf5;
  --good:#2FD27A; --serious:#FF6B2C; --pearl:#f4efe4;
  --orb-hi:#2c3e39; --orb-lo:#101917;
  --glow:rgba(142,205,180,.12); --aurora:rgba(142,205,180,.16);
  --shadow:0 24px 40px -24px rgba(0,0,0,.85);
  --hi:inset 0 1px 0 rgba(255,255,255,.05);
  --track:#0e1714; --strip-buy:#3a4a44; --strip-empty:#111a17;
}
/* พื้นหลัง: ออโรราจาง 2 จุด (นิ่ง ไม่ขยับ) */
body{background:
  radial-gradient(760px 420px at 85% -140px,var(--aurora),transparent 70%) no-repeat,
  radial-gradient(520px 420px at -10% 38%,var(--glow),transparent 70%) no-repeat,var(--plane)}
/* ตัวเลข = Sora (ไม่มีอักษรไทย ⇒ ตกไป Plex Thai เอง) */
header .bt b,.ring .val b,.tile .v,.pf-val{font-family:"Sora","IBM Plex Sans Thai",system-ui,sans-serif}
header .bt b{font-weight:500;font-size:21px;letter-spacing:.01em}
header .bt small{font-size:8.5px;font-weight:500;letter-spacing:.12em;color:var(--muted)}   /* "TRISON DEYE SOLAR" ยาวขึ้น ⇒ ช่องไฟแคบลง ไม่ให้ชนปุ่ม (วัดที่ 390px) */
header{gap:8px}
header .iconbtn{width:34px;height:34px}
header .stamp{font-size:10.5px;white-space:nowrap}
header .logo{width:38px;height:38px;color:var(--solar);
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--solar) 18%,var(--surface)),var(--surface) 75%);
  box-shadow:inset 0 0 0 1px var(--hair)}
header .logo svg{width:28px;height:28px}
.iconbtn{background:color-mix(in srgb,var(--surface) 80%,transparent);border-color:var(--brass-soft);color:var(--brass)}
.iconbtn:hover{color:var(--ink);border-color:var(--brass)}
:focus-visible{outline-color:var(--brass)}
/* การ์ด = กระจกควัน: ขอบเส้นผม + แสงหยกมุมขวาบน */
.card{border-radius:16px;border:1px solid var(--ring);
  background:radial-gradient(380px 200px at 88% 0%,var(--aurora),transparent 70%),var(--surface);
  box-shadow:var(--hi),var(--shadow)}
.card:has(.hero){box-shadow:var(--hi),var(--shadow)}
.card:has(.pflow){background:
  radial-gradient(420px 220px at 75% 25%,var(--aurora),transparent 70%),
  radial-gradient(300px 200px at 15% 90%,var(--glow),transparent 70%),var(--surface)}
.card h2{font-weight:500;letter-spacing:.02em}
.card h2 .badge{color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass-soft)}
.tile{border-radius:12px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);box-shadow:inset 0 0 0 1px var(--ring)}
.tile .v{font-weight:500;letter-spacing:-.01em}
.ring .val b{font-weight:500;font-size:38px;letter-spacing:-.02em}
.ring .val b .pc{font-size:16px}
.ring .val .rname{font-weight:500;letter-spacing:.04em}
.tabs{background:color-mix(in srgb,var(--plane) 86%,transparent)}
.tabs button::before{background:var(--brass)}
.tabs button[aria-selected="true"] .g{background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass)}
.seg-ctl button.on{box-shadow:inset 0 0 0 1px var(--brass-soft)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:var(--plane)}
.spill.on i{animation:spdot 2.4s ease-in-out infinite}   /* จุด Online กลับมาหายใจ (ล้ำ ≠ นิ่ง) */
.strip svg rect{rx:3px}

/* ---------- ผังไฟ Boreal ---------- */
.pflow svg{max-width:400px;overflow:visible}
.pf-deco{fill:none;stroke:var(--hair);stroke-opacity:.3;stroke-width:1}
.pf-track{fill:none;stroke:var(--track);stroke-width:3;stroke-linecap:round}
.pf-haze{fill:none;stroke-width:8;stroke-linecap:round}
.pf-core{fill:none;stroke-width:1.2;stroke-linecap:round}
.pf-lab{font-size:12.5px;fill:var(--muted)}
.pf-val{font-size:20px;font-weight:500;fill:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pf-u{font-size:12px;fill:var(--muted)}
.pf-hubt{font:500 10.5px "Sora","IBM Plex Sans Thai",sans-serif;letter-spacing:.2em;fill:var(--brass)}
.pf-halo{opacity:0}
.pf-on .pf-halo{animation:pfbr 2.8s ease-in-out infinite}
@keyframes pfbr{0%,100%{opacity:.04}50%{opacity:.2}}
.pf-off{opacity:.55}
.pf-aura{opacity:.12;animation:pfau 2.6s ease-in-out infinite}
@keyframes pfau{0%,100%{opacity:.08}50%{opacity:.26}}
.pf-spin,.pf-orbit{transform-box:fill-box;transform-origin:center;animation:pfsp 16s linear infinite}
.pf-orbit{animation-duration:9s}
@keyframes pfsp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .pf-on .pf-halo,.pf-aura,.pf-spin,.pf-orbit,.spill.on i{animation:none} }

/* ---------- v3.18.1 หัวจอ 2 แถวแบบ mock ----------
   แถว 1: ตราแดด · เส้นคั่นตั้ง · บ้าน+88/318 ตัวใหญ่ · แบรนด์ช่องไฟกว้าง · ปุ่มกลมขอบหยก
   แถว 2: Online | อัปเดต | คลัง (สถานะเต็มความกว้าง · .sep มาจาก JS) */
header{flex-wrap:wrap;gap:0 10px;padding:4px 2px 10px}
header h1{margin-right:auto;gap:12px}
header .logo{width:58px;height:58px;background:none;box-shadow:none;border-radius:0}
header .logo svg{width:58px;height:58px;overflow:visible}
header .vbar{width:1px;align-self:stretch;margin:4px 0;background:var(--hair);opacity:.7}
header .bt{line-height:1.05}
header .bt b{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:400;letter-spacing:.01em}
header .bt b .hh{width:22px;height:22px;color:var(--ink-2);flex-shrink:0}
header .bt small{font-size:9.5px;font-weight:400;letter-spacing:.34em;margin-top:6px;color:var(--ink-2)}
header .iconbtn{width:42px;height:42px;font-size:17px;border:1px solid var(--brass-soft);

         ในหน้าตั้งค่ามีปุ่ม "ล้างคลังในเครื่อง" + ช่อง API URL ที่กดพลาดแล้วแอปเปิดไม่ขึ้น

<script>
/* ===================================================================
   0) config
   =================================================================== */
var DEFAULT_API = "https://script.google.com/macros/s/AKfycbwTr9FGZYAWcuI4UUx0JWTwgdpyrr8IPooeCNYBj0SEjproemzfiznJOiDjyPcYbBHB/exec";
/* เปิดด้วย ...index.html?api=<url ของ /exec>&key=<ถ้ามี> ได้
   ใช้ตอนอยากชี้ไป deployment เทสโดยไม่ต้องเข้าไปแก้ในหน้าตั้งค่า (?cfg=1)
   ค่าที่ส่งมาทาง URL ถูกบันทึกลงเครื่องเลย เปิดครั้งหน้าไม่ต้องใส่ซ้ำ */
(function(){
  try{
    var q = new URLSearchParams(location.search);
    ["api","key"].forEach(function(k){
      var v = q.get(k);
      if(v){ try{ localStorage.setItem("solar3_"+k, v); }catch(e){} }
    });
  }catch(e){}
})();

var S = {
  api:   ls("api", DEFAULT_API),
  rate:  +ls("rate", "4.40"),      // 🟡 ค่าตั้งต้น ยังไม่ได้ยืนยันกับบิล PEA จริง — แก้ได้ที่หน้าตั้งค่า (?cfg=1)
  /* v3.18.8 มิเตอร์ TOU (Napon: "อย่าลืมคำนวน เรท มิเตอรแบบ tou ด้วย")
     🟡 ค่าตั้งต้น = อัตราบ้านอยู่อาศัย TOU แรงดันต่ำ ตามข่าวฐานเศรษฐกิจ (ค้น 22 พ.ย. 2026) · ยังไม่รวม Ft / VAT
        ยังไม่ได้ยืนยันกับบิล PEA จริง → แก้ได้ที่หน้าตั้งค่า · ใช้กับตัวเลข "วันนี้" ที่มีข้อมูลราย 5 นาทีเท่านั้น */
  ratePk: +ls("ratePk", "5.7982"),
  rateOff:+ls("rateOff","2.6369"),
  /* 2026-09-22 Napon สั่งให้ความจุแบตตั้งต้นที่ 14.1 kWh
     🔴 ใส่ default ใน ls() อย่างเดียวไม่พอ — ปุ่มบันทึกในหน้าตั้งค่า (?cfg=1) เขียน "0" ลงเครื่องเมื่อช่องว่าง
        (เดิม: value||"0") ⇒ เครื่องที่เคยกดบันทึกจะค้างที่ 0 แล้ว default ใหม่ไม่มีวันถูกใช้
     ⇒ ต้อง migrate ด้วย: ค่าที่อ่านได้ <= 0 หรืออ่านไม่ออก ให้ถือเป็น 14.1
     🔵 เครื่องที่เคยกรอกเลขจริงไว้ (เช่น 9.6) ยังใช้ค่าของตัวเองเหมือนเดิม */
  cap:   (function(){ var v = +ls("cap", "14.1"); return (isNaN(v) || v <= 0) ? 14.1 : v; })(),
  key:   ls("key", ""),
  tab:   "now",
  range: ls("range", "30"),        // มุมมองหน้าประวัติ: 30 | 90 | month | cycle
  d:     null,
  err:   null,
  sync:  null                      // ผลการ sync รอบล่าสุด (มีกี่วันใหม่)
};
function ls(k, dflt){ try{ var v = localStorage.getItem("solar3_"+k); return v===null?dflt:v; }catch(e){ return dflt; } }
function save(k, v){ try{ localStorage.setItem("solar3_"+k, v); }catch(e){} }

/* -------------------------------------------------------------------
   คลังข้อมูลในเครื่อง (localStorage)
   เก็บเป็น map date -> [gen,use,imp,exp,chg,dis] เพื่อให้ merge แบบ upsert ได้
   โหลดครั้งถัดไปขอ server แค่ ?since=<วันล่าสุดที่มี> เท่านั้น
   ~1,100 วัน ≈ 50 KB (เพดาน localStorage ~5 MB) จึงเก็บทั้งหมดได้จริง
   ------------------------------------------------------------------- */
var STORE = { map:{}, dirty:false };
function storeLoad(){
  try{
    var raw = localStorage.getItem("solar3_days");
    STORE.map = raw ? JSON.parse(raw) : {};
  }catch(e){ STORE.map = {}; }
}
/* 2026-10-08 กติกาเขียนคลัง (Napon สั่ง) — กันข้อมูลเก่าพัง
   1. วันที่ยังไม่มีในคลัง = เพิ่มได้เสมอ
   2. วันที่มีอยู่แล้ว = แก้ได้เฉพาะ WRITE_BACK_DAYS วันล่าสุด · เก่ากว่านั้นไม่แตะ
   3. ค่าที่มีอยู่แล้วห้ามลด — เอาค่ามากกว่ารายช่อง (kWh รายวันเป็นยอดสะสม ลดลง = ของใหม่ผิด)
   🔴 บั๊กที่กัน: server ส่งแถวเมื่อวานเป็นยอดตี 1 (เกือบ 0) ช่วง 00:00–01:00 แล้วทับยอดจริงในคลัง
   🔑 รอบ "ดึงทั้งหมด" (?cfg=1 / ซ่อมคลังอัตโนมัติ) ก็อยู่ใต้กติกาเดียวกัน — เพิ่มได้แค่วันที่ยังไม่มี ไม่ replace ของเก่า
   repairFrom = ข้อยกเว้นเดียว: รอบซ่อมครั้งเดียว (REPAIR_FROM) ขยายข้อ 2 ไปถึงวันนั้น · ข้อ 3 ยังบังคับ ⇒ ทำได้แค่ "ยกค่าขึ้น" */
var REPAIR_FROM = "2026-09-23";               // วันแรกที่คลังถูกยอดตี 1 ทับ (🟢 ตรวจ localStorage 8 ต.ค. 2026)
/* คลังยังมี "รอยยอดตี 1" ในช่วงซ่อมไหม — ผลิต ~0 และใช้ < 4 kWh ทั้งวัน (วันปกติใช้ 20+ kWh)
   ดูเฉพาะวันที่เก่ากว่า 5 วัน เพราะ 5 วันล่าสุดรอบปกติยกค่าให้เองอยู่แล้ว
   🔑 ใช้อาการในคลังเป็นตัวสั่งซ่อม ไม่ใช่ flag "เคยซ่อมแล้ว" — หน้าต่างรุ่นเก่าที่เปิดค้างทับของที่ซ่อมกลับได้ */
function needRepair(){
  var floor = isoBack(WRITE_BACK_DAYS);
  for(var d in STORE.map){
    if(d < REPAIR_FROM || d >= floor) continue;
    var v = STORE.map[d];
    if(v && (v[0]===null || v[0] <= 0.05) && typeof v[1]==="number" && v[1] < 4) return true;
  }
  return false;
}
var WRITE_BACK_DAYS = 5;
function isoBack(n){
  var x = new Date(); x.setDate(x.getDate()-n);
  return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2);
}
function keepMax(oldV, newV){
  var out = [], chg = false;
  for(var i=0;i<6;i++){
    var a = oldV ? oldV[i] : null, b = newV[i];
    var an = (typeof a==="number" && !isNaN(a)), bn = (typeof b==="number" && !isNaN(b));
    var v = (an && bn) ? Math.max(a,b) : (an ? a : (bn ? b : (a===undefined?null:a)));
    if(v !== a) chg = true;
    out.push(v);
  }
  return chg ? out : null;                    // null = ไม่มีอะไรเปลี่ยน
}
function storeMerge(rows, repairFrom){
  var added = 0, upd = 0, floor = isoBack(WRITE_BACK_DAYS);
  if(repairFrom && repairFrom < floor) floor = repairFrom;
  (rows||[]).forEach(function(r){
    var d = r[0]; if(!d) return;
    var v = [r[1],r[2],r[3],r[4],r[5],r[6]];
    var old = STORE.map[d];
    if(old===undefined){ STORE.map[d] = v; added++; return; }
    if(d < floor) return;                     // เก่ากว่า 5 วัน (หรือเก่ากว่าช่วงซ่อม) ไม่แตะ
    var nv = keepMax(old, v);
    if(nv){ STORE.map[d] = nv; upd++; }
  });
  if(added||upd){ STORE.dirty = true; storeSave(); }
  return { added:added, updated:upd };
}
/* 2026-09-23 เขียนแบบ "รวม" ไม่ใช่ "ทับทั้งก้อน"
   🔴 บั๊กที่เจอ: หน้าต่าง PWA รุ่นเก่าเปิดค้าง (ในหน่วยความจำมี 47 วัน) รีเฟรชทุก 2 นาทีแล้ว setItem ทั้งก้อน
      ⇒ คลัง 235 วันที่เพิ่งซ่อมถูกทับกลับเป็น 47 (🟢 ตรวจ 16:23: solar3_heal="235" แต่ solar3_days มี 47)
   ✅ ใหม่: อ่านของที่อยู่ในเครื่องก่อน วันที่หน้าต่างนี้ไม่มีแต่ในเครื่องมี = เก็บไว้ · วันที่ซ้ำ = ค่าของหน้าต่างนี้ชนะ (ใหม่กว่า)
      ⇒ หน้าต่างไหนก็ทำให้คลัง "หด" ไม่ได้ และหน้าต่างนี้ได้วันที่หน้าต่างอื่นดึงมาไปด้วย
   🔑 กันได้เฉพาะหน้าต่างที่รันโค้ดรุ่นนี้ขึ้นไป — หน้าต่างรุ่นเก่าที่เปิดค้างยังทับได้จนกว่าจะปิด */
function storeSave(){
  try{
    var raw = localStorage.getItem("solar3_days"), cur = raw ? JSON.parse(raw) : {};
    /* 2026-10-08 วันที่ซ้ำ: เดิม "ค่าของหน้าต่างนี้ชนะ" ⇒ หน้าต่างที่ถือค่าเก่าในหน่วยความจำทับของที่หน้าต่างอื่นเพิ่งซ่อม
       (🟢 8 ต.ค. 01:0x: ซ่อม 23 ก.ย. เป็น 18.7 แล้ว ถูกหน้าต่างที่เปิดค้างทับกลับเป็น 0) ⇒ ใหม่: ห้ามลด เอาค่ามากกว่ารายช่อง */
    for(var d in cur){
      if(STORE.map[d]===undefined) STORE.map[d] = cur[d];
      else { var mx = keepMax(STORE.map[d], cur[d]); if(mx) STORE.map[d] = mx; }
    }
    localStorage.setItem("solar3_days", JSON.stringify(STORE.map)); STORE.dirty=false;
  }
  catch(e){ S.storeErr = "เก็บลงเครื่องไม่ได้: "+e; }
}
function storeRows(){
  return Object.keys(STORE.map).sort().map(function(d){
    var v = STORE.map[d]; return [d, v[0], v[1], v[2], v[3], v[4], v[5]];
  });
}
function storeMax(){ var k = Object.keys(STORE.map); return k.length ? k.sort()[k.length-1] : null; }
function storeMin(){ var k = Object.keys(STORE.map); return k.length ? k.sort()[0] : null; }
function storeCount(){ return Object.keys(STORE.map).length; }
function storeBytes(){ try{ return (localStorage.getItem("solar3_days")||"").length; }catch(e){ return 0; } }

/* -------------------------------------------------------------------
   snapshot ค่า "ตอนนี้" ล่าสุด (เพิ่ม 2026-09-22)
   ปัญหา: ตอน boot เดิมส่ง now:{} + intraday ว่างเข้า derive() ⇒ การ์ด Battery
          กับผังไฟวิ่งโชว์ "—" ทุกช่องจนกว่า ?f=json จะกลับมา (วัดได้ >38.9 วิ)
   แก้:   จำ now + intraday ของรอบล่าสุดไว้ แล้ววาดทันทีตอนเปิด พร้อมบอกว่าเป็นค่าเก่า
   🔵 ใช้เฉพาะ snapshot ของ "วันนี้" — ข้ามวันแล้วค่ากำลังไฟกับกราฟในวันใช้ต่อไม่ได้
   ~20 KB ต่อ snapshot (เพดาน localStorage ~5 MB)
   ------------------------------------------------------------------- */
function snapSave(j){
  try{
    localStorage.setItem("solar3_snap", JSON.stringify({
      ts: j.ts, day: j.today, now: j.now||{}, intraday: j.intraday||null
    }));
  }catch(e){}   // เต็มก็แค่ไม่มี snapshot ไม่ทำให้หน้าพัง
}
function snapLoad(){
  try{
    var s = JSON.parse(localStorage.getItem("solar3_snap")||"null");
    if(!s) return null;
    if(s.day !== localDay()) return null;   // ข้ามวันแล้ว ทิ้ง
    return s;
  }catch(e){ return null; }
}

/* ===================================================================
   1) utils
   =================================================================== */
function n1(v){ return (v===null||v===undefined||isNaN(v))?null:Math.round(v*10)/10; }
function f(v, dec){ if(v===null||v===undefined||isNaN(v)) return "—";
  return Number(v).toLocaleString("th-TH",{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }
function fw(v){ return v===null||v===undefined||isNaN(v) ? "—" : f(Math.round(v)); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
/* 2026-09-23 วันที่ตามเวลาเครื่อง (ไทย) — เดิมใช้ toISOString() ซึ่งเป็น UTC
   ⇒ 00:00–06:59 เวลาไทยได้วันที่ของเมื่อวาน การ์ด "ผลิตแล้ว/ซื้อไฟแล้ว" เลยหยิบแถวเมื่อวานมาโชว์ */
function localDay(){ var n=new Date(); return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2); }
function hhmm(mins){ var h=Math.floor(mins/60), m=mins%60; return ("0"+h).slice(-2)+":"+("0"+m).slice(-2); }
function dLabel(iso){ var p=String(iso).split("-"); return p.length===3 ? (+p[2])+"/"+(+p[1]) : iso; }
function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function socColor(soc){ return soc===null?"var(--muted)":(soc>=50?"var(--good)":(soc>=20?"var(--warn)":"var(--crit)")); }

/* ===================================================================
   2) derive — ทุกตัวเลขที่ไม่ได้มาจาก API ตรง ๆ คำนวณที่เดียวตรงนี้
      กติกา: ค่าที่ "อนุมานเอา" ต้องมีชื่อบอกว่าอนุมาน และต้องโชว์ส่วนต่างเสมอ
   =================================================================== */
function derive(d){
  var w = d.now || {};
  ["soc","batt","pv","load","grid"].forEach(function(k){
    if(w[k]===undefined || w[k]==="" || (typeof w[k]==="number" && isNaN(w[k]))) w[k] = null;
  });
  d.now = w;
  var days = (d.days||[]).map(function(r){
    var o = { date:r[0], gen:r[1], use:r[2], imp:r[3], exp:r[4], chg:r[5], dis:r[6] };
    var use=o.use||0, imp=o.imp||0, dis=o.dis||0, gen=o.gen||0, chg=o.chg||0, exp=o.exp||0;
    o.self = Math.max(0, use - imp - dis);              // แดดที่ใช้ตรงในบ้าน
    o.ss   = use>0 ? (use-imp)/use*100 : null;          // พึ่งตัวเอง %
    o.loss = gen - (o.self + chg + exp);                // ส่วนต่างฝั่งผลิต (แปลงไฟ/วัดคนละจุด)
    o.cost = imp*S.rate;
    o.saved= (o.self + dis)*S.rate;
    return o;
  });
  d._days = days;
  d._byDate = {}; days.forEach(function(x){ d._byDate[x.date]=x; });
  d._today = d._byDate[d.today] || null;
  var it = d.intraday || {t:[]};
  d._intra = it;
  // สถิติในวัน — จาก array ราย 5 นาทีที่ V2 ทิ้งไปทั้งก้อน
  var peak=null, peakAt=null, socMin=null, socMax=null, coverMin=0, lastT=null;
  var gridFreeMin=0, impPeak=null, hasGrid=!!(it.grid && it.grid.length);
  for(var i=0;i<(it.t||[]).length;i++){
    var pv=it.pv[i], ld=it.load[i], sc=it.soc[i], t=it.t[i];
    var gw = hasGrid ? it.grid[i] : null;      // wirePower: บวก = ซื้อเข้า, ลบ = ไหลออก
    if(pv!==null && (peak===null||pv>peak)){ peak=pv; peakAt=t; }
    if(sc!==null){ if(socMin===null||sc<socMin) socMin=sc; if(socMax===null||sc>socMax) socMax=sc; }
    var span = lastT===null ? 0 : Math.min(30, t-lastT);
    if(pv!==null && ld!==null && pv>=ld) coverMin += span;
    if(gw!==null && gw<50) gridFreeMin += span;   // <50W = ถือว่าไม่ได้ซื้อไฟ
    if(gw!==null && (impPeak===null||gw>impPeak)) impPeak = gw;
    lastT = t;
  }
  d._stat = { peak:peak, peakAt:peakAt, socMin:socMin, socMax:socMax, coverMin:coverMin,
              gridFreeMin:gridFreeMin, hasGrid:hasGrid, impPeak:impPeak,
              samples:(it.t||[]).length, lastT:lastT };
  // รอบบิล
  var c = d.cycle||{};
  d._cyc  = cycleStats(days, c.start, c.end, d.today);
  d._prev = cycleStats(days, c.prevStart, c.prevEnd, null);
  return d;
}
/* v3.18.8 TOU — on-peak = จันทร์–ศุกร์ 09:00–22:00 · ที่เหลือ (รวมเสาร์–อาทิตย์) = off-peak
   🔴 ยังไม่รู้วันหยุดราชการ (ตามประกาศ วันหยุดนักขัตฤกษ์ปกติ = off-peak ทั้งวัน) ⇒ วันนั้นจะคิดแพงเกินจริง */
function touPeak(dateStr, min){
  var wd = new Date(dateStr+"T12:00:00").getDay();
  return wd>=1 && wd<=5 && min>=540 && min<1320;
}
/* ค่าไฟ/ประหยัดของวันนี้แบบ TOU
   ใช้ข้อมูลราย 5 นาทีหา "สัดส่วน peak/off" ของไฟที่ซื้อ และของไฟที่ไม่ต้องซื้อ
   แล้วคูณกับ kWh ทางการของทั้งวัน (t.imp · t.self+t.dis) ⇒ kWh ที่โชว์ตรงกับกล่องอื่นในหน้า */
function touToday(d){
  var t = d._today, it = d._intra || {t:[]}, n = (it.t||[]).length;
  if(!t) return null;
  var bPk=0,bOff=0,sPk=0,sOff=0;
  for(var i=0;i<n;i++){
    var t0=it.t[i], t1=(i+1<n)?Math.min(it.t[i+1],t0+30):Math.min(1440,t0+5);
    if(t1<=t0) continue;
    var ld=it.load[i], gr=(it.grid&&it.grid.length)?it.grid[i]:null;
    if(ld===null||gr===null) continue;
    var buy=Math.max(0,gr), keep=Math.max(0,ld-buy), pk=touPeak(d.today,t0), span=t1-t0;
    if(pk){ bPk+=buy*span; sPk+=keep*span; } else { bOff+=buy*span; sOff+=keep*span; }
  }
  var imp=t.imp||0, sav=(t.self||0)+(t.dis||0);
  var fb = (bPk+bOff)>0 ? bPk/(bPk+bOff) : 0;          // สัดส่วนที่ซื้อช่วง peak
  var fs = (sPk+sOff)>0 ? sPk/(sPk+sOff) : 0;
  return { imp:imp, impPk:imp*fb, impOff:imp*(1-fb),
           cost: imp*(fb*S.ratePk+(1-fb)*S.rateOff),
           sav:sav, savPk:sav*fs,
           saved: sav*(fs*S.ratePk+(1-fs)*S.rateOff),
           samples:n };
}
function cycleStats(days, start, end, today){
  if(!start) return null;
  var rows = days.filter(function(x){ return x.date>=start && x.date<=end; });
  var done = rows.filter(function(x){ return x.date!==today; });   // วันนี้ยังไม่จบ -> ไม่เอาไปหารเฉลี่ย
  var sum = function(arr,k){ return arr.reduce(function(a,b){ return a+(b[k]||0); },0); };
  var totalDays = Math.round((new Date(end)-new Date(start))/86400000)+1;
  var avgImp = done.length ? sum(done,"imp")/done.length : null;
  return {
    start:start, end:end, rows:rows, days:rows.length, doneDays:done.length, totalDays:totalDays,
    imp:sum(rows,"imp"), exp:sum(rows,"exp"), gen:sum(rows,"gen"), use:sum(rows,"use"),
    self:sum(rows,"self"), dis:sum(rows,"dis"),
    cost:sum(rows,"imp")*S.rate, saved:sum(rows,"saved"),
    avgImp:avgImp,
    projImp: avgImp===null ? null : avgImp*totalDays,
    projCost:avgImp===null ? null : avgImp*totalDays*S.rate,
    missing: totalDays>=rows.length ? 0 : 0
  };
}

/* -------------------------------------------------------------------
   จัดกลุ่มข้อมูลย้อนหลัง — ใช้กับหน้า "ประวัติ"
   วันที่ยังไม่จบ (วันนี้) ติดธง partial ทุกที่ ไม่ถูกนับในค่าเฉลี่ย
   ------------------------------------------------------------------- */
var TH_M = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function monthLabel(ym){ var p=ym.split("-"); return TH_M[+p[1]-1]+" "+String(+p[0]+543).slice(-2); }
function cycleKeyOf(iso, startDay){
  var p = iso.split("-"), y=+p[0], m=+p[1], d=+p[2];
  if(d < startDay){ m--; if(m<1){ m=12; y--; } }
  return y+"-"+("0"+m).slice(-2)+"-"+("0"+startDay).slice(-2);
}
function groupRows(days, mode, today, startDay){
  var src = days, keyOf, labOf;
  if(mode==="30" || mode==="90"){
    src = days.slice(-(+mode));
    keyOf = function(x){ return x.date; };
    labOf = function(k){ return dLabel(k); };
  } else if(mode==="month"){
    keyOf = function(x){ return x.date.slice(0,7); };
    labOf = monthLabel;
  } else {
    keyOf = function(x){ return cycleKeyOf(x.date, startDay||17); };
    // รอบบิลคาบ 2 เดือน — ป้ายต้องบอกทั้งคู่ ไม่งั้นแยกจากมุมมองรายเดือนไม่ออก
    labOf = function(k){ var p=k.split("-"), m=+p[1]-1;
      return TH_M[m]+"→"+TH_M[(m+1)%12]+" "+String(+p[0]+543).slice(-2); };
  }
  var by = {}, order = [];
  src.forEach(function(x){
    var k = keyOf(x);
    if(!by[k]){ by[k] = { key:k, label:labOf(k), gen:0,use:0,imp:0,exp:0,chg:0,dis:0,self:0,
                          nDays:0, partial:false, first:x.date, last:x.date }; order.push(k); }
    var b = by[k];
    b.gen+=x.gen||0; b.use+=x.use||0; b.imp+=x.imp||0; b.exp+=x.exp||0;
    b.chg+=x.chg||0; b.dis+=x.dis||0; b.self+=x.self||0;
    b.nDays++; b.last = x.date;
    if(x.date===today) b.partial = true;
  });
  order.sort();
  return order.map(function(k){
    var b = by[k];
    b.ss = b.use>0 ? (b.use-b.imp)/b.use*100 : null;
    b.cost = b.imp*S.rate; b.saved = (b.self+b.dis)*S.rate;
    return b;
  });
}

/* ===================================================================
   3) chart engine — SVG ล้วน ไม่มี library
      กติกาที่บังคับตัวเองไว้ (skill dataviz):
        • แกน y แกนเดียวต่อ panel เสมอ — kW กับ % อยู่คนละ panel ห้ามรวม
        • เส้น 2px · จุด >=8px · ช่องว่าง 2px ระหว่าง segment ที่ติดกัน
        • grid เส้นบาง สีจาง · ไม่มีตัวเลขบนทุกจุด ติดป้ายเฉพาะจุดที่ต้องอ่าน
   =================================================================== */
function mkSvg(w,h){ return ['<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img">']; }
function chartHost(id){ var el=document.getElementById(id); return el && el.clientWidth>0 ? el : null; }

/* --- 3a) time series (เส้น/พื้นที่) สำหรับกราฟรายช่วงในวัน --- */
function timeSeries(host, cfg){
  var W = host.clientWidth, H = cfg.h||150, P = {t:12,r:8,b:20,l:34};
  var xs = cfg.x, series = cfg.series;
  if(!xs.length){ host.innerHTML = '<div class="empty">'+(cfg.empty||"ยังไม่มีข้อมูล")+'</div>'; return; }
  var xMin = cfg.xMin!==undefined?cfg.xMin:xs[0], xMax = cfg.xMax!==undefined?cfg.xMax:xs[xs.length-1];
  var yMax = cfg.yMax || 0;
  series.forEach(function(s){ s.vals.forEach(function(v){ if(v!==null&&v>yMax) yMax=v; }); });
  yMax = niceMax(yMax);
  var px = function(x){ return P.l + (x-xMin)/(xMax-xMin||1)*(W-P.l-P.r); };
  var py = function(y){ return P.t + (1-(y/(yMax||1)))*(H-P.t-P.b); };
  var o = mkSvg(W,H);

  // grid + y ticks
  var ticks = cfg.yTicks || [0, yMax/2, yMax];
  ticks.forEach(function(v){
    o.push('<line x1="'+P.l+'" y1="'+py(v)+'" x2="'+(W-P.r)+'" y2="'+py(v)+
      '" stroke="var(--line)" stroke-width="1"/>');
    o.push('<text x="'+(P.l-6)+'" y="'+(py(v)+3.5)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">'+
      (cfg.yFmt?cfg.yFmt(v):f(v))+'</text>');
  });
  // x ticks
  (cfg.xTicks||[]).forEach(function(t){
    o.push('<text x="'+px(t.v)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+t.l+'</text>');
  });

  series.forEach(function(s){
    var dLine=[], dArea=[], open=false;
    for(var i=0;i<xs.length;i++){
      var v=s.vals[i];
      if(v===null||v===undefined){ open=false; continue; }
      var X=px(xs[i]).toFixed(1), Y=py(v).toFixed(1);
      if(!open){ dLine.push("M"+X+" "+Y); dArea.push("M"+X+" "+py(0).toFixed(1)+"L"+X+" "+Y); open=true; }
      else { dLine.push("L"+X+" "+Y); dArea.push("L"+X+" "+Y); }
      if(i===xs.length-1) dArea.push("L"+X+" "+py(0).toFixed(1)+"Z");
    }
    if(s.area) o.push('<path d="'+dArea.join("")+'" fill="'+s.color+'" opacity=".16"/>');
    o.push('<path d="'+dLine.join("")+'" fill="none" stroke="'+s.color+
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
  });
  // baseline
  o.push('<line x1="'+P.l+'" y1="'+py(0)+'" x2="'+(W-P.r)+'" y2="'+py(0)+'" stroke="var(--axis)" stroke-width="1"/>');
  // crosshair
  o.push('<line id="'+host.id+'-ch" x1="0" y1="'+P.t+'" x2="0" y2="'+py(0)+
    '" stroke="var(--axis)" stroke-width="1" opacity="0"/>');
  series.forEach(function(s,i){
    o.push('<circle id="'+host.id+'-d'+i+'" r="4.5" fill="'+s.color+
      '" stroke="var(--surface)" stroke-width="2" opacity="0"/>');
  });
  o.push('</svg><div class="tip" id="'+host.id+'-tip"></div>');
  host.innerHTML = o.join("");

  var tip = document.getElementById(host.id+"-tip"), ch = document.getElementById(host.id+"-ch");
  function move(ev){
    var r = host.getBoundingClientRect();
    var mx = (ev.touches?ev.touches[0].clientX:ev.clientX) - r.left;
    var xv = xMin + (mx-P.l)/((W-P.l-P.r)||1)*(xMax-xMin);
    var bi=0, bd=Infinity;
    for(var i=0;i<xs.length;i++){ var dd=Math.abs(xs[i]-xv); if(dd<bd){bd=dd;bi=i;} }
    var X = px(xs[bi]);
    ch.setAttribute("x1",X); ch.setAttribute("x2",X); ch.setAttribute("opacity","1");
    var html = '<b>'+cfg.xLabel(xs[bi])+'</b>';
    series.forEach(function(s,i){
      var v=s.vals[bi], dot=document.getElementById(host.id+"-d"+i);
      if(v===null||v===undefined){ dot.setAttribute("opacity","0"); return; }
      dot.setAttribute("cx",X); dot.setAttribute("cy",py(v)); dot.setAttribute("opacity","1");
      html += '<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+
        s.color+';margin-right:5px"></i>'+s.name+' <b>'+(cfg.vFmt?cfg.vFmt(v):f(v))+'</b>';
    });
    tip.innerHTML = html; tip.classList.add("on");
    var tw = tip.offsetWidth;
    tip.style.left = Math.max(2, Math.min(W-tw-2, X-tw/2))+"px";
    tip.style.top  = "0px";
  }
  function out(){ tip.classList.remove("on"); ch.setAttribute("opacity","0");
    series.forEach(function(s,i){ document.getElementById(host.id+"-d"+i).setAttribute("opacity","0"); }); }
  host.addEventListener("pointermove", move);
  host.addEventListener("pointerleave", out);
  host.addEventListener("touchmove", function(e){ move(e); }, {passive:true});
  host.addEventListener("touchend", out);
}

/* --- 3b) bar / stacked bar รายวัน --- */
function bars(host, cfg){
  var W = host.clientWidth, H = cfg.h||140, P={t:12,r:6,b:18,l:30};
  var lab = cfg.labels, ser = cfg.series;
  if(!lab.length){ host.innerHTML='<div class="empty">'+(cfg.empty||"ยังไม่มีข้อมูล")+'</div>'; return; }
  var totals = lab.map(function(_,i){
    return cfg.stacked ? ser.reduce(function(a,s){ return a+(s.vals[i]||0); },0)
                       : Math.max.apply(null, ser.map(function(s){ return s.vals[i]||0; }));
  });
  var yMax = niceMax(Math.max.apply(null, totals));
  var bw = (W-P.l-P.r)/lab.length;
  var innerW = Math.max(2, Math.min(cfg.maxBar||26, bw-2));
  var py = function(y){ return P.t + (1-(y/(yMax||1)))*(H-P.t-P.b); };
  var o = mkSvg(W,H);
  [0, yMax/2, yMax].forEach(function(v){
    o.push('<line x1="'+P.l+'" y1="'+py(v)+'" x2="'+(W-P.r)+'" y2="'+py(v)+'" stroke="var(--line)"/>');
    o.push('<text x="'+(P.l-5)+'" y="'+(py(v)+3.5)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">'+
      f(v, yMax<10?1:0)+'</text>');
  });
  if(cfg.refLine!==undefined && cfg.refLine!==null){
    o.push('<line x1="'+P.l+'" y1="'+py(cfg.refLine)+'" x2="'+(W-P.r)+'" y2="'+py(cfg.refLine)+
      '" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" opacity=".65"/>');
    o.push('<text x="'+(W-P.r)+'" y="'+(py(cfg.refLine)-4)+'" text-anchor="end" font-size="9.5" fill="var(--ink-2)">'+
      esc(cfg.refLabel||"")+'</text>');
  }
  var grouped = !cfg.stacked && ser.length>1;          // หลาย series หน่วยเดียวกัน -> วางข้างกัน
  lab.forEach(function(L,i){
    var x0 = P.l + bw*i + (bw-innerW)/2, acc = 0;
    var partial = cfg.partialIdx===i;
    var gw = grouped ? Math.max(1.5, (innerW-2*(ser.length-1))/ser.length) : innerW;
    ser.forEach(function(s, si){
      var v = s.vals[i]; if(v===null||v===undefined||v<=0) return;
      var x = grouped ? x0 + si*(gw+2) : x0;
      var y0 = py(acc), y1 = py(acc+v), h = Math.max(1, y0-y1-(cfg.stacked?2:0));
      o.push('<rect x="'+x.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+gw.toFixed(1)+
        '" height="'+h.toFixed(1)+'" rx="2.5" fill="'+s.color+'"'+
        (partial?' opacity=".55" stroke="'+s.color+'" stroke-width="1" stroke-dasharray="2 2"':'')+'/>');
      if(cfg.stacked) acc += v;
    });
    o.push('<rect class="hit" data-i="'+i+'" x="'+(P.l+bw*i)+'" y="'+P.t+'" width="'+bw+
      '" height="'+(H-P.t-P.b)+'" fill="transparent"/>');
  });
  var step = Math.ceil(lab.length/6);
  lab.forEach(function(L,i){
    if(i%step) return;
    o.push('<text x="'+(P.l+bw*i+bw/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+
      esc(L)+'</text>');
  });
  o.push('<line x1="'+P.l+'" y1="'+py(0)+'" x2="'+(W-P.r)+'" y2="'+py(0)+'" stroke="var(--axis)"/>');
  o.push('</svg><div class="tip" id="'+host.id+'-tip"></div>');
  host.innerHTML = o.join("");
  var tip = document.getElementById(host.id+"-tip");
  host.addEventListener("pointermove", function(ev){
    var t = ev.target.closest ? ev.target.closest(".hit") : null;
    if(!t){ tip.classList.remove("on"); return; }
    var i = +t.getAttribute("data-i");
    var html = '<b>'+esc(cfg.tipLabel?cfg.tipLabel(i):lab[i])+'</b>';
    ser.forEach(function(s){
      var v=s.vals[i]; if(v===null||v===undefined) return;
      html += '<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+
        s.color+';margin-right:5px"></i>'+s.name+' <b>'+f(v,1)+(cfg.unit||"")+'</b>';
    });
    if(cfg.partialIdx===i) html += '<br><span style="color:var(--muted)">⧗ วันนี้ยังไม่จบ</span>';
    tip.innerHTML = html; tip.classList.add("on");
    var X = P.l + bw*i + bw/2, tw = tip.offsetWidth;
    tip.style.left = Math.max(2, Math.min(W-tw-2, X-tw/2))+"px"; tip.style.top="0px";
  });
  host.addEventListener("pointerleave", function(){ tip.classList.remove("on"); });
}
function niceMax(v){
  if(!v||v<=0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log10(v))), n = v/mag;
  var step = n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
  return step*mag;
}

    + '<path d="M'+x+' '+(y-33)+' V'+(y-29)+' M'+x+' '+(y+29)+' V'+(y+33)+' M'+(x-33)+' '+y+' H'+(x-29)+' M'+(x+29)+' '+y+' H'+(x+33)+'" stroke="var(--hair)" stroke-width="1"/>'

}
/** defs ใช้ร่วมทั้งผัง — มีผังเดียวต่อหน้า ⇒ id ไม่ชน */

/* ---------- อนุภาค (requestAnimationFrame) ----------
   render() เขียน innerHTML ใหม่ทุกรอบ ⇒ pfStart() ถูกเรียกท้าย render() ทุกครั้ง: หยุดลูปเก่า แล้วผูกกับ path ชุดใหม่
   ไม่มีผังในหน้า (อยู่แท็บอื่น) = ไม่เริ่มลูป · แท็บถูกซ่อน = เบราว์เซอร์หยุด rAF เอง ไม่กินแบต */
var PFX = { raf:0, edges:[], last:0 };
function pfStart(){
  if(PFX.raf) cancelAnimationFrame(PFX.raf);
  PFX.raf=0; PFX.edges=[]; PFX.last=0;
  var svg = document.querySelector(".pflow svg");
  if(!svg || PF_REDUCE) return;
  var fx = svg.querySelector(".pf-fx"), NS = "http://www.w3.org/2000/svg";
  var cores = svg.querySelectorAll(".pf-core[data-w]");
  for(var c=0;c<cores.length;c++){
    var path = cores[c], col = path.getAttribute("data-col"), len = path.getTotalLength(), parts = [];
    for(var i=0;i<PF_FX.n;i++){
      var glow = document.createElementNS(NS,"circle");
      glow.setAttribute("r", PF_FX.head*2.4); glow.setAttribute("fill", col); glow.setAttribute("filter","url(#pfGlow)");
      fx.appendChild(glow);
      var els = [];
      for(var j=0;j<PF_FX.tail;j++){
        var el = document.createElementNS(NS,"circle");
        el.setAttribute("r", (PF_FX.head*(1-j/PF_FX.tail*.75)).toFixed(2));
        el.setAttribute("fill", j===0 ? "var(--pearl)" : col);
        fx.appendChild(el); els.push(el);
      }
      parts.push({ p:i/PF_FX.n, els:els, glow:glow });
    }
    var q = Math.min(+path.getAttribute("data-w")/3000, 1);
    PFX.edges.push({ path:path, len:len, rev:path.getAttribute("data-rev")==="1", speed:PF_FX.v0+PF_FX.v1*q, parts:parts });
  }
  if(PFX.edges.length) PFX.raf = requestAnimationFrame(pfStep);
}
function pfAt(el, e, t){
  var pt = e.path.getPointAtLength(Math.max(0, Math.min(e.len, t*e.len)));
  el.setAttribute("cx", pt.x.toFixed(1)); el.setAttribute("cy", pt.y.toFixed(1));
}
function pfStep(now){
  if(!PFX.edges.length || !PFX.edges[0].path.isConnected){ PFX.raf=0; return; }   // ผังถูกเขียนทับ/เปลี่ยนแท็บแล้ว
  var dt = PFX.last ? Math.min(.05, (now-PFX.last)/1000) : 0; PFX.last = now;
  for(var a=0;a<PFX.edges.length;a++){
    var e = PFX.edges[a], dir = e.rev ? -1 : 1;
    for(var b=0;b<e.parts.length;b++){
      var pt = e.parts[b];
      pt.p = (pt.p + e.speed*dt/e.len) % 1;
      var t = e.rev ? 1-pt.p : pt.p;
      var fade = Math.min(1, pt.p*6, (1-pt.p)*6);       // ค่อย ๆ โผล่/จางที่หัวท้ายเส้น ไม่กระตุก
      for(var j=0;j<pt.els.length;j++){
        pfAt(pt.els[j], e, t - dir*j*PF_FX.gap/e.len);
        pt.els[j].style.opacity = ((1-j/PF_FX.tail)*fade).toFixed(2);
      }
      pfAt(pt.glow, e, t); pt.glow.style.opacity = (.45*fade).toFixed(2);
    }
  }
  PFX.raf = requestAnimationFrame(pfStep);
}

/* --- 3e) ไอคอนแบตในกล่อง "ชาร์จ/จ่าย" ---
   แบตวางซ้าย ลูกศรอยู่ขวา ⇒ ชี้ซ้าย = ไฟเข้าแบต · ชี้ขวา = ดึงออกจากแบต
   ระดับไฟในไอคอน = SOC จริง (ไม่ใช่ภาพประกอบลอย ๆ) · สีรับจาก --tc ของกล่อง = สีเดียวกับเส้นในผังไฟวิ่ง
   เกณฑ์ 20 W และสูตรความเร็วใช้ชุดเดียวกับ pflow() — สองที่ต้องเล่าเรื่องเดียวกันเสมอ */
function battChip(batt, soc){
  var on  = batt!==null && batt!==undefined && !isNaN(batt) && Math.abs(batt)>20;
  var chg = on && batt<0;
  var lvl = (soc===null||soc===undefined||isNaN(soc)) ? 0 : Math.max(0,Math.min(100,soc));
  var w   = 38*lvl/100;
  var sp  = on ? Math.max(0.50, Math.min(2.4, 2.4 - Math.abs(batt)/1400)) : 1.3;
  var chev = '';
  if(on){
    var d = chg ? 'M5 -6 L-1 0 L5 6' : 'M-1 -6 L5 0 L-1 6';
    for(var i=0;i<3;i++)
      // 🔴 ต้องห่อ <g> แล้วขยับ <path> ข้างใน — CSS transform ของแอนิเมชัน "ทับ" attribute
      //    transform ของ SVG ทั้งอัน (ไม่ใช่บวกกัน) ถ้าใส่ไว้ที่ path เดียวกัน ลูกศรจะกระโดด
      //    ไปมุมซ้ายบนแล้วหลุดออกนอก viewBox = หายไปเงียบ ๆ (เจอจริง 22 ก.ย. 2026 ตอนเปิดดูบนจอ)
      // 🔵 delay ใส่ inline ไม่ใช้ :nth-of-type เพราะตอนนี้แต่ละ path อยู่คนละ <g> แล้ว
      chev += '<g transform="translate('+(60+i*12)+' 16)">'
           +  '<path class="bchev" d="'+d+'" style="animation-delay:'+(sp*i/3).toFixed(2)+'s"'
           +  ' fill="none" stroke="var(--tc)" stroke-width="2.4"'
           +  ' stroke-linecap="round" stroke-linejoin="round"/></g>';
  }
  return '<svg class="bchip'+(chg?' in':'')+'" viewBox="0 0 96 32" aria-hidden="true"'
    + ' style="--sp:'+sp.toFixed(2)+'s">'
    + '<rect x="2" y="5" width="44" height="22" rx="5.5" fill="none" stroke="var(--tc)" stroke-width="2.2"/>'
    + '<rect x="47.5" y="12" width="4" height="8" rx="1.6" fill="var(--tc)"/>'
    + (w>0 ? '<rect x="5.5" y="8.5" width="'+w.toFixed(1)+'" height="15" rx="2.6" fill="var(--tc)"/>' : '')
    + chev + '</svg>';
}

/* --- 3f) แถบ 24 ชั่วโมง — ชาร์จ / ใช้แบต / ซื้อไฟ ---
   🔴 sample ราย 5 นาทีไม่มีค่าแบตมาตรง ๆ (intraday_ ส่งมาแค่ t·pv·load·soc·grid)
      ได้จากสมดุล  load = pv + batt + grid  =>  batt = load - pv - grid
      🔑 สูตรกลับด้านของที่ getData_ ใช้คำนวณ grid ⇒ ใช้นิยามเดียวกันทั้งแอป
   🔵 เกณฑ์ 20 W = ชุดเดียวกับผังทิศทางไฟและไอคอนแบต (sensor แกว่งระดับนั้นเป็นปกติ)
   🔵 "ไม่มีข้อมูล" กับ "ซื้อไฟ" ต้องแยกกันให้ออก: ไม่มี sample = พื้นการ์ด · มี sample แต่ซื้อไฟ = เทา */
/* 🔴 เกณฑ์ "ชาร์จ" ต้อง > 100 W (Napon ทัก: ตี 4 ขึ้นเขียวทั้งที่ไม่น่าชาร์จได้)
   🟢 ตรวจแล้วสูตรไม่ผิด — probe 2026-06-01 กลางคืน: batteryPower จริง = -52 W
      สูตร batt = load-pv-grid = 1417-2-1468 = -53 ⇒ ตรงกับของจริง
      ⇒ แบตมัน "จิบ" ไฟจากกริดจริง ~50 W แต่ไม่ควรนับว่าชาร์จ
   🔵 ฝั่งจ่ายออกยังใช้ 20 W ตามเดิม — Napon ระบุมาเฉพาะฝั่งชาร์จ */
var STRIP_CHG_W = 100;              // ชาร์จ: ต้องเกิน 100 W ถึงนับ
var STRIP_DIS_W = 20;               // จ่ายออก: เกณฑ์เดิม
var STRIP_CHG = "var(--batt)";      // เขียว
var STRIP_DIS = "var(--batt-dis)";  // ส้มแดง = ใช้แบต
var STRIP_BUY = "var(--line)";      // เทา = ซื้อไฟ/นิ่ง (ไม่ลงสีตามที่สั่ง)

function dayStrip(d){
  var it = d._intra || {t:[]}, n = (it.t||[]).length, hasG = !!(it.grid && it.grid.length);
  // นับนาทีของแต่ละสถานะ แยกราย "ชั่วโมง" 24 ช่อง — ช่องละ 1 ชม. เหมือนเซลล์บนแผงโซลาร์
  var H = [], k; for(k=0;k<24;k++) H.push({chg:0,dis:0,buy:0,any:0});
  var tot = {chg:0,dis:0,buy:0};
  for(var i=0;i<n;i++){
    var t0 = it.t[i];
    var t1 = (i+1<n) ? Math.min(it.t[i+1], t0+30) : Math.min(1440, t0+5);
    if(t1<=t0) continue;
    var pv=it.pv[i], ld=it.load[i], gr=hasG?it.grid[i]:null;
    if(pv===null||ld===null||gr===null) continue;
    var batt = ld - pv - gr;
    var key = (batt < -STRIP_CHG_W) ? "chg" : (batt > STRIP_DIS_W ? "dis" : "buy");
    // 🔴 ช่วงหนึ่งคร่อม 2 ชั่วโมงได้ — ต้องหั่นตามขอบชั่วโมง ไม่งั้นช่องที่วาดจะเพี้ยน
    var a = t0;
    while(a < t1){
      var hIdx = Math.min(23, Math.floor(a/60));
      var b = Math.min(t1, (hIdx+1)*60);
      H[hIdx][key] += (b-a); H[hIdx].any += (b-a);
      H[hIdx].pv = (H[hIdx].pv||0) + Math.max(0,pv)*(b-a);   // v3.18.1 W·นาที ⇒ เฉลี่ยรายชั่วโมงไว้ทำความสูงแท่ง
      tot[key] += (b-a);
      a = b;
    }
  }
  /* 2026-11-22 v3.18.1 แท่งมีมิติแบบ mock (Napon: "24 ชม. ใน mock มีมิติมากๆ")
     🔑 2 ข้อมูลในแท่งเดียว: "สี" = สถานะเดิม (เขียวชาร์จ · ส้มใช้แบต · เทาซื้อไฟ — ความหมายไม่เปลี่ยน)
        "ความสูง" = แดดผลิตเฉลี่ยชั่วโมงนั้น เทียบชั่วโมงสูงสุดของวัน (ใหม่ — mock ก็เป็นทรงระฆังตามแดด)
     ชั่วโมงที่มีข้อมูลแต่แดด ~0 (กลางคืน) = ตอสูง 4 · ยังไม่ถึงชั่วโมงนั้น = ตอจาง 3
     แท่งไล่เฉดบนสว่าง→ล่างจาง + แสงฟุ้งใต้แท่ง (filter) + เส้นฐาน + ขีดเวลา */
  var W=360, gap=3, cw=(W-gap*23)/24, base=40, top=4, hMax=base-top;   // v3.18.2 base 56->40 (S24 พอดีจอ)
  var pmax = 0;
  for(k=0;k<24;k++) if(H[k].any) pmax = Math.max(pmax, (H[k].pv||0)/H[k].any);
  var o = ['<svg viewBox="0 0 '+W+' 60" role="img" aria-label="24 แท่ง ชั่วโมงละ 1 แท่ง: สี = ชาร์จ/ใช้แบต/ซื้อไฟ · ความสูง = แดดที่ผลิต">'
    + '<defs>'
    + '<linearGradient id="stChg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+STRIP_CHG+'"/><stop offset="1" style="stop-color:'+STRIP_CHG+';stop-opacity:.28"/></linearGradient>'
    + '<linearGradient id="stDis" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+STRIP_DIS+'"/><stop offset="1" style="stop-color:'+STRIP_DIS+';stop-opacity:.3"/></linearGradient>'
    + '<linearGradient id="stBuy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+STRIP_BUY+'"/><stop offset="1" style="stop-color:'+STRIP_BUY+';stop-opacity:.45"/></linearGradient>'
    + '<filter id="stGlow" x="-50%" y="-30%" width="200%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
    + '</defs><g filter="url(#stGlow)">'];
  for(k=0;k<24;k++){
    var c = H[k], x = k*(cw+gap), fill, h;
    if(!c.any){ h = 3; fill = "var(--strip-empty)"; }                          // ยังไม่มีข้อมูลชั่วโมงนั้น
    else {
      fill = (c.chg >= c.dis && c.chg >= c.buy) ? "url(#stChg)"                 // ชาร์จเป็นหลัก
           : (c.dis >= c.buy ? "url(#stDis)" : "url(#stBuy)");                  // ใช้แบต / ซื้อไฟ-นิ่ง
      var avg = (c.pv||0)/c.any;
      h = pmax > 0 ? Math.max(4, hMax * avg / pmax) : 4;
    }
    o.push('<rect x="'+x.toFixed(2)+'" y="'+(base-h).toFixed(1)+'" width="'+cw.toFixed(2)+'" height="'+h.toFixed(1)+
           '" rx="2" fill="'+fill+'"/>');
  }
  o.push('</g><path d="M0 '+(base+1.5)+' H'+W+'" stroke="var(--hair)" stroke-width=".6" opacity=".6"/>');
  for(var hh=0; hh<=24; hh+=6){
    var lx = hh===0 ? cw/2 : (hh===24 ? W-cw/2 : hh*(cw+gap) - gap/2);
    o.push('<path d="M'+lx.toFixed(1)+' '+(base+3)+' V'+(base+7)+'" stroke="var(--hair)" stroke-width=".8"/>');
    o.push('<text class="hr" x="'+lx.toFixed(1)+'" y="'+(base+18)+'" text-anchor="middle">'+(hh<10?'0':'')+hh+'</text>');
  }
  o.push('</svg>');
  // 2026-09-22 ตัด legend + คำอธิบายทิ้งทั้งหมด — Napon สั่ง (กินความสูงจนล้นจอมือถือ)
  // 🔵 เวลารวมรายสถานะ (tot) ยังคำนวณอยู่ แต่ไม่ได้แสดง เอากลับมาได้ทุกเมื่อ
  return '<div class="strip">'+o.join('')+'</div>'
    + (n ? '' : '<p class="note">ยังไม่มีข้อมูลของวันนี้</p>');
}

function pflow(pv, load, batt, grid, soc){
  var gridOut = (grid!==null && grid<0);
  // v3.18.4 ใช้แบต (batt>0 = จ่ายออก) = ส้มแดง · ชาร์จ/นิ่ง = เขียว
  var cSun='var(--solar)', cBatt=(batt!==null && batt>=20 ? 'var(--batt-dis)' : 'var(--batt)'), cHome='var(--home)',
      cGrid = gridOut ? 'var(--export)' : 'var(--grid)';
  var on = function(v){ return v!==null && v!==undefined && !isNaN(v) && Math.abs(v)>=20; };
  var c = PF_HUB;
  // เส้นทุกเส้นเก็บเป็น โหนด -> ฮับ · rev=true = ไฟไหลจากฮับออกไปหาโหนด
  var e = pfEdge("sun",  cSun,  pv,   false)                     // แดดเข้าเสมอ
        + pfEdge("home", cHome, load, true)                      // บ้านออกเสมอ (ฮับ -> บ้าน)
        + pfEdge("batt", cBatt, batt, batt!==null && batt<0)     // ชาร์จ: ฮับ -> แบต · จ่ายออก: แบต -> ฮับ
        + pfEdge("grid", cGrid, grid, gridOut);                  // ไหลออกกริด: ฮับ -> กริด · ซื้อ: กริด -> ฮับ

  return '<div class="pflow"><svg viewBox="0 0 '+PF_VB.w+' '+PF_VB.h+'" role="img" aria-label="ผังทิศทางไฟตอนนี้">'
    + pfDefs()
    // วงโคจรประดับจาง ๆ ทั้งการ์ด (หอดูดาว) — วาดก่อนทุกอย่าง
    + '<ellipse class="pf-deco" cx="'+c.x+'" cy="'+c.y+'" rx="176" ry="68"/>'
    + '<ellipse class="pf-deco" cx="'+c.x+'" cy="'+c.y+'" rx="120" ry="40" stroke-dasharray="2 5"/>'
    + e
    + '<g class="pf-fx"></g>'
    + pfHub()
    + pfNode("sun",  pfIconSun(cSun),  'แดด', fw(pv), cSun, on(pv))
    + pfNode("batt", pfIconBatt(cBatt, soc),
        (batt!==null&&batt<0?'ชาร์จเข้าแบต':'จากแบต'),
        (batt===null?'—':fw(Math.abs(batt))), cBatt, on(batt))
    + pfNode("grid", pfIconGrid(cGrid),
        (grid===null?'กริด':(gridOut?'ไหลออกกริด':'ซื้อจากกริด')),
        (grid===null?'—':fw(Math.abs(grid))), cGrid, on(grid))
    + pfNode("home", pfIconHome(cHome, load), 'บ้าน', fw(load), cHome, on(load))
    + '</svg></div>';
}
