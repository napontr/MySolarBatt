<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eda100">
<title>88/318 Deye Solar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2218%22%20fill%3D%22%2328a745%22%2F%3E%3Crect%20x%3D%2217.6%22%20y%3D%2233.2%22%20width%3D%2260%22%20height%3D%2233.5%22%20rx%3D%227.4%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%225.2%22%2F%3E%3Crect%20x%3D%2279.4%22%20y%3D%2243.2%22%20width%3D%224.5%22%20height%3D%2213.5%22%20rx%3D%221.8%22%20fill%3D%22%23ffffff%22%2F%3E%3Crect%20x%3D%2227.5%22%20y%3D%2243.1%22%20width%3D%2229%22%20height%3D%2213.7%22%20rx%3D%223%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===================================================================
   สี: ชุด categorical ที่ผ่าน validator ของ skill dataviz แล้ว
   node scripts/validate_palette.js "#eda100,#1baf7a,#e34948" --mode light  -> PASS
   node scripts/validate_palette.js "#c98500,#199e70,#e66767" --mode dark   -> PASS
   node scripts/validate_palette.js "#2a78d6,#1baf7a,#4a3aa7" ทั้ง 2 โหมด   -> PASS
   คู่ที่อยู่ใน warn band (แดง<->เขียว CVD 6.5-6.9) ใช้ได้เพราะมี secondary
   encoding ครบ: ป้ายตัวเลขติดบนแท่ง + legend + ตารางข้อมูล
   🔴 ห้ามสลับสีตามอันดับ/ตามลำดับที่มาก่อนหลัง — สีผูกกับ "ของสิ่งนั้น" ถาวร
   =================================================================== */
:root{
  color-scheme: light;
  --plane:#f3f3f1; --surface:#fcfcfb; --surface-2:#f3f3f1;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --line:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --solar:#eda100; --batt:#1baf7a; --grid:#e34948; --home:#2a78d6; --export:#4a3aa7;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 8px 24px rgba(11,11,11,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --solar:#c98500; --batt:#199e70; --grid:#e66767; --home:#3987e5; --export:#9085e9;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#242422;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --solar:#c98500; --batt:#199e70; --grid:#e66767; --home:#3987e5; --export:#9085e9;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
body{display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
.app{width:100%;max-width:480px;padding:10px 12px 60px}   /* 2026-09-22 บีบให้พอดีจอ S24U */

/* ---------- chrome ---------- */
header{display:flex;align-items:center;gap:10px;padding:2px 2px 7px}
header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
header .stamp{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.35}
/* 2026-09-22 แคปซูลสถานะ (Napon สั่ง) — เดิมบอกออฟไลน์ด้วยข้อความสีส้มลอย ๆ อ่านผ่านตาได้ง่าย
   จุดกลม + พื้นสีอ่อน ทำให้เห็นสถานะก่อนอ่านตัวหนังสือ · จุดกะพริบเฉพาะตอน Online */
.spill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  padding:2px 9px 2px 7px;border-radius:999px;letter-spacing:.02em;
  background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc)}
.spill i{width:6px;height:6px;border-radius:50%;background:var(--sc);flex-shrink:0}
.spill.on{--sc:var(--good)}
.spill.on i{animation:spdot 2s ease-in-out infinite}
.spill.off{--sc:var(--warn)}
.spill.wait{--sc:var(--muted)}
@keyframes spdot{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){ .spill.on i{animation:none} }
.iconbtn{border:1px solid var(--ring);background:var(--surface);color:var(--ink-2);
  width:32px;height:32px;border-radius:10px;font-size:14px;cursor:pointer;flex-shrink:0}
.iconbtn:active{transform:scale(.94)}

.card{background:var(--surface);border:1px solid var(--ring);border-radius:16px;
  padding:11px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
.card h2{font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 2px;
  letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.card h2 .badge{margin-left:auto;font-size:10px;font-weight:600;padding:2px 7px;
  border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.card .why{font-size:11px;color:var(--muted);margin:0 0 10px;line-height:1.5}

/* ---------- tabs ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;
  background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--ring);z-index:20;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs .inner{display:flex;width:100%;max-width:480px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px 2px 11px;
  font-size:10.5px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-family:inherit}
.tabs button .g{font-size:17px;line-height:1}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] .g{transform:translateY(-1px)}

/* ---------- hero ---------- */
/* 2026-09-22 รอบ 2: 3 คอลัมน์ "กว้างเท่ากัน" ตามที่ Napon สั่งให้สมมาตร
   ของเดิมคอลัมน์ซ้ายเป็น auto (กว้างตามโดนัท) ทำให้ 3 ช่องไม่เท่ากัน */
.hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:stretch}
/* ทุกกล่องในแถบบน: ป้าย/ตัวเลข/ไอคอน จัดกึ่งกลางทั้งแนวตั้งและแนวนอน · ป้ายเป็นตัวหนา */
.hero .tile{align-items:center;text-align:center}
.hero .tile .l{font-weight:700;color:var(--ink-2)}
.hero .tile .v,.hero .tile .s{width:100%}
/* 2026-09-22 กล่อง Battery เล็กลง + ย้ายการ์ด ผลิตแล้ว/ซื้อไฟแล้ว มาอยู่ขวามือ (Napon สั่ง) */
/* 3 คอลัมน์: ซ้าย = Battery+โดนัท · กลาง = ชาร์จ/จ่าย · ขวา = ผลิตแล้ว/ซื้อไฟแล้ว
   สัดส่วนตามสเก็ตช์ที่ Napon ส่งมา (37% / 26% / 27%) */
.heroL{display:flex;flex-direction:column;align-items:center;justify-content:center}
/* 2026-09-22 ขยายตัวอักษรส่วนบนทั้งแถบ (Napon สั่ง) — ของเดิมเล็กไปเมื่อเทียบกับการ์ดล่าง */
.ringWrap{text-align:center}
.ringWrap .mx{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.heroR{min-width:0;display:grid;grid-template-rows:1fr 1fr;gap:6px}
.heroR .tile{display:flex;flex-direction:column;justify-content:center;padding:7px 9px}
.heroR .tile .l{font-size:12px}
.heroR .tile .v{font-size:22px}
.heroR .tile .v u{font-size:11px}
.heroR .tile .s{font-size:11px}
/* กล่องกลางสูงเต็มแถว — เขียว = ไฟเข้าแบต · แดง = ดึงออกจากแบต (สีชุดเดียวกับผังไฟวิ่ง) */
.hero > .tile.tb{min-width:0;box-sizing:border-box;display:flex;flex-direction:column;
  justify-content:center;padding:7px 9px}
.tile.tb .l{white-space:normal;font-size:12px}
.tile.tb .v{font-size:31px}
.tile.tb .v u{font-size:12px}
.tile.tb .s{color:var(--tc);margin-top:3px;font-size:11.5px}
.tile.tb .bsign{font-size:15px;font-weight:700}

/* ---------- ไอคอนแบตในกล่องชาร์จ/จ่าย ----------
   ระดับไฟในไอคอน = SOC จริง · ลูกศรวิ่งเข้า/ออกตามเครื่องหมายของ batt
   ความเร็วผูกกับกำลังไฟผ่าน --sp เหมือนผังไฟวิ่ง ⇒ 2 ที่ในหน้าเดียวเล่าเรื่องเดียวกัน */
.bchip{display:block;width:100%;max-width:104px;height:auto;margin:4px auto 5px}
.bchev{animation:bchevOut var(--sp,1.3s) linear infinite}
.bchip.in .bchev{animation-name:bchevIn}
.bchev:nth-of-type(2){animation-delay:calc(var(--sp,1.3s) * .33)}
.bchev:nth-of-type(3){animation-delay:calc(var(--sp,1.3s) * .66)}
@keyframes bchevOut{0%{opacity:0;transform:translateX(-7px)}
                    40%{opacity:1}100%{opacity:0;transform:translateX(9px)}}
@keyframes bchevIn {0%{opacity:0;transform:translateX(9px)}
                    40%{opacity:1}100%{opacity:0;transform:translateX(-7px)}}
@media (prefers-reduced-motion:reduce){
  .bchev{animation:none;opacity:.85}   /* ลูกศรยังชี้ทิศอยู่ แค่ไม่วิ่ง */
}
.ring{width:132px;height:132px;flex-shrink:0;position:relative}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring .val .rname{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1;margin-bottom:2px}
.ring .val b{font-size:39px;font-weight:600;line-height:1;letter-spacing:-.02em}
.ring .val b .pc{font-size:18px;font-weight:600;color:inherit;opacity:.75}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:4px 11px;border-radius:999px}
.hero .meta{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:6px}
.hero .meta b{font-variant-numeric:tabular-nums}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles.c3{grid-template-columns:1fr 1fr 1fr}
.tile{background:var(--surface-2);border-radius:12px;padding:9px 11px;min-width:0}
.tile .l{font-size:10.5px;color:var(--muted);margin-bottom:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.tile .v u{font-size:10px;font-weight:500;color:var(--muted);text-decoration:none;margin-left:2px}
.tile .s{font-size:10px;color:var(--muted);margin-top:2px}

/* สีการ์ดตาม "ความหมาย" ไม่ใช่ตามลำดับ — ใช้สีชุดเดียวกับผังไฟ ⇒ เหลืองในกราฟ = เหลืองในการ์ด = แดด
   🔴 ห้ามสลับสีตามตำแหน่ง/อันดับ · สีผูกกับความหมายถาวร (กฎเดียวกับหัวไฟล์)
   ตัวเลขเป็น 19px ตัวหนา = large text ⇒ เกณฑ์ contrast 3:1 ไม่ใช่ 4.5:1 · ป้ายกับหมายเหตุยังเป็น --muted เหมือนเดิม */
.tile.t{background:color-mix(in srgb,var(--tc) 9%,var(--surface-2));box-shadow:inset 3px 0 0 var(--tc)}
.tile.t .v{color:var(--tc)}
.t-good{--tc:var(--batt)}    /* เขียว — ไม่ต้องซื้อไฟ · ประหยัดได้ · มูลค่าที่ได้คืน */
.t-gen {--tc:var(--solar)}   /* เหลือง — การผลิต */
.t-self{--tc:var(--home)}    /* น้ำเงิน — พึ่งตัวเอง · ยอดผลิตสะสม */
.t-cost{--tc:var(--grid)}    /* แดง — ซื้อไฟ · ค่าไฟ */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tile.t{background:color-mix(in srgb,var(--tc) 14%,var(--surface-2))}
}
:root[data-theme="dark"] .tile.t{background:color-mix(in srgb,var(--tc) 14%,var(--surface-2))}

/* ---------- flow ---------- */
.flow{display:flex;align-items:stretch;gap:8px;margin-top:4px}
.node{flex:1;background:var(--surface-2);border-radius:12px;padding:9px 8px;text-align:center}
.node .n{font-size:10.5px;color:var(--muted)}
.node .w{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.node .w u{font-size:9px;color:var(--muted);text-decoration:none}
.arrow{display:flex;align-items:center;color:var(--muted);font-size:13px}

/* ---------- power flow — ไฟวิ่งตามทิศจริง ----------
   เส้นจาง = เส้นทางที่มีอยู่ · เส้นประวิ่ง = มีไฟไหลอยู่จริงตอนนี้
   ทิศวิ่ง = ทิศของ path (จุดเริ่ม -> จุดจบ) ⇒ โค้ดสลับต้น/ปลายตามเครื่องหมายของค่า
   ความเร็ว = ผูกกับกำลังไฟจริงผ่าน --sp (ยิ่งเยอะยิ่งเร็ว) ไม่ใช่ความเร็วคงที่ */
.pflow svg{display:block;width:100%;max-width:372px;margin:0 auto;height:auto;overflow:visible}
.pf-line{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.22}
.pf-dash{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 14;
  animation:pfrun var(--sp,1.6s) linear infinite}
@keyframes pfrun{to{stroke-dashoffset:-22}}
.pf-node{fill:var(--surface-2);stroke:var(--ring);stroke-width:1}
.pf-lab{font-size:13px;fill:var(--muted)}
.pf-val{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pf-u{font-size:10.5px;fill:var(--muted);font-weight:400}
.pf-rays{transform-box:fill-box;transform-origin:center;animation:pfspin 26s linear infinite}
@keyframes pfspin{to{transform:rotate(360deg)}}
.pf-off{opacity:.34}
/* เคารพคนที่ปิดแอนิเมชันในระบบ — เส้นประยังอยู่ แค่ไม่วิ่ง จึงยังอ่านออกว่าเส้นไหนมีไฟ */
@media (prefers-reduced-motion:reduce){
  .pf-dash,.pf-rays{animation:none}
  .pf-dash{opacity:.9}
}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);
  border:1px solid var(--ring);border-radius:9px;padding:6px 9px;font-size:11px;
  box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:5;opacity:0;transition:opacity .1s;
  white-space:nowrap;line-height:1.6}
.tip.on{opacity:1}
.tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 13px;font-size:11px;color:var(--ink-2);margin-top:9px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;
  vertical-align:-1px;font-style:normal}

/* ---------- balance bars ---------- */
.bal{margin-top:11px}
.bal .row{margin-bottom:11px}
.bal .cap{display:flex;font-size:11px;color:var(--muted);margin-bottom:5px}
.bal .cap b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.bal .track{display:flex;height:30px;gap:2px;border-radius:7px;overflow:hidden}
.bal .seg{display:flex;align-items:center;justify-content:center;font-size:10.5px;
  font-weight:600;color:#fff;min-width:2px;overflow:hidden;white-space:nowrap}
.bal .seg.dim{background:var(--line)!important;color:var(--ink-2)}

/* ---------- misc ---------- */
.recon{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2);
  background:var(--surface-2);border-radius:9px;padding:7px 10px;margin-top:10px;line-height:1.5}
.recon .st{font-weight:700;flex-shrink:0}
.note{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:9px}
table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:10px}
th:first-child,td:first-child{text-align:left}
details>summary{font-size:11px;color:var(--ink-2);cursor:pointer;padding:7px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}
details[open]>summary::before{content:"▾ "}
.field{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12px}
.field label{flex:1;color:var(--ink-2)}
.field input,.field select{width:112px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--ring);border-radius:9px;padding:6px 9px;font-size:12px;
  font-family:inherit;text-align:right}
.field input.wide{width:100%;text-align:left;font-size:11px}
.seg-ctl{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:11px}
.seg-ctl button{flex:1;border:0;background:none;color:var(--ink-2);font-family:inherit;
  font-size:11.5px;padding:7px 2px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg-ctl button.on{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.10)}
.btn{border:1px solid var(--ring);background:var(--surface-2);color:var(--ink);
  font-family:inherit;font-size:12px;padding:9px 14px;border-radius:11px;cursor:pointer;
  margin:0 8px 8px 0}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--home);border-color:var(--home);color:#fff;font-weight:600}
.empty{font-size:12px;color:var(--muted);text-align:center;padding:22px 8px;line-height:1.7}
.err{color:var(--crit);font-size:12px;line-height:1.7;word-break:break-word}
.skel{height:13px;border-radius:5px;background:var(--surface-2);animation:p 1.3s infinite}
@keyframes p{50%{opacity:.45}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>88/318 Deye Solar</h1>
    <button class="iconbtn" id="btnTheme" title="สลับธีม">◐</button>
    <button class="iconbtn" id="btnCfg" title="ตั้งค่า">⚙</button>
    <div class="stamp" id="stamp"><span class="spill wait"><i></i>กำลังเชื่อมต่อ</span></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs"><div class="inner">
  <button data-tab="now"  aria-selected="true"><span class="g">⚡</span>ตอนนี้</button>
  <button data-tab="day"  aria-selected="false"><span class="g">☀</span>วันนี้</button>
  <button data-tab="cyc"  aria-selected="false"><span class="g">฿</span>รอบบิล</button>
  <button data-tab="hist" aria-selected="false"><span class="g">▤</span>ประวัติ</button>
</div></nav>

<script>
/* ===================================================================
   0) config
   =================================================================== */
var DEFAULT_API = "https://script.google.com/macros/s/AKfycbwTr9FGZYAWcuI4UUx0JWTwgdpyrr8IPooeCNYBj0SEjproemzfiznJOiDjyPcYbBHB/exec";
/* เปิดด้วย ...index.html?api=<url ของ /exec>&key=<ถ้ามี> ได้
   ใช้ตอนอยากชี้ไป deployment เทสโดยไม่ต้องเข้าไปแก้ใน ⚙
   ค่าที่ส่งมาทาง URL ถูกบันทึกลงเครื่องเลย เปิดครั้งหน้าไม่ต้องใส่ซ้ำ */
(function(){
  try{
    var q = new URLSearchParams(location.search);
    ["api","key"].forEach(function(k){
      var v = q.get(k);
      if(v){ try{ localStorage.setItem("solar3_"+k, v); }catch(e){} }
    });
  }catch(e){}
})();

var S = {
  api:   ls("api", DEFAULT_API),
  rate:  +ls("rate", "4.40"),      // 🟡 ค่าตั้งต้น ยังไม่ได้ยืนยันกับบิล PEA จริง — แก้ได้ที่ ⚙
  cap:   +ls("cap", "0"),          // ความจุแบต kWh (0 = ไม่รู้ -> ซ่อนการ์ดที่ต้องใช้)
  key:   ls("key", ""),
  tab:   "now",
  range: ls("range", "30"),        // มุมมองหน้าประวัติ: 30 | 90 | month | cycle
  d:     null,
  err:   null,
  sync:  null                      // ผลการ sync รอบล่าสุด (มีกี่วันใหม่)
};
function ls(k, dflt){ try{ var v = localStorage.getItem("solar3_"+k); return v===null?dflt:v; }catch(e){ return dflt; } }
function save(k, v){ try{ localStorage.setItem("solar3_"+k, v); }catch(e){} }

/* -------------------------------------------------------------------
   คลังข้อมูลในเครื่อง (localStorage)
   เก็บเป็น map date -> [gen,use,imp,exp,chg,dis] เพื่อให้ merge แบบ upsert ได้
   โหลดครั้งถัดไปขอ server แค่ ?since=<วันล่าสุดที่มี> เท่านั้น
   ~1,100 วัน ≈ 50 KB (เพดาน localStorage ~5 MB) จึงเก็บทั้งหมดได้จริง
   ------------------------------------------------------------------- */
var STORE = { map:{}, dirty:false };
function storeLoad(){
  try{
    var raw = localStorage.getItem("solar3_days");
    STORE.map = raw ? JSON.parse(raw) : {};
  }catch(e){ STORE.map = {}; }
}
function storeMerge(rows){
  var added = 0, upd = 0;
  (rows||[]).forEach(function(r){
    var d = r[0]; if(!d) return;
    var v = [r[1],r[2],r[3],r[4],r[5],r[6]];
    if(STORE.map[d]===undefined) added++; else upd++;
    STORE.map[d] = v;
  });
  if(added||upd){ STORE.dirty = true; storeSave(); }
  return { added:added, updated:upd };
}
function storeSave(){
  try{ localStorage.setItem("solar3_days", JSON.stringify(STORE.map)); STORE.dirty=false; }
  catch(e){ S.storeErr = "เก็บลงเครื่องไม่ได้: "+e; }
}
function storeRows(){
  return Object.keys(STORE.map).sort().map(function(d){
    var v = STORE.map[d]; return [d, v[0], v[1], v[2], v[3], v[4], v[5]];
  });
}
function storeMax(){ var k = Object.keys(STORE.map); return k.length ? k.sort()[k.length-1] : null; }
function storeMin(){ var k = Object.keys(STORE.map); return k.length ? k.sort()[0] : null; }
function storeCount(){ return Object.keys(STORE.map).length; }
function storeBytes(){ try{ return (localStorage.getItem("solar3_days")||"").length; }catch(e){ return 0; } }

/* -------------------------------------------------------------------
   snapshot ค่า "ตอนนี้" ล่าสุด (เพิ่ม 2026-09-22)
   ปัญหา: ตอน boot เดิมส่ง now:{} + intraday ว่างเข้า derive() ⇒ การ์ด Battery
          กับผังไฟวิ่งโชว์ "—" ทุกช่องจนกว่า ?f=json จะกลับมา (วัดได้ >38.9 วิ)
   แก้:   จำ now + intraday ของรอบล่าสุดไว้ แล้ววาดทันทีตอนเปิด พร้อมบอกว่าเป็นค่าเก่า
   🔵 ใช้เฉพาะ snapshot ของ "วันนี้" — ข้ามวันแล้วค่ากำลังไฟกับกราฟในวันใช้ต่อไม่ได้
   ~20 KB ต่อ snapshot (เพดาน localStorage ~5 MB)
   ------------------------------------------------------------------- */
function snapSave(j){
  try{
    localStorage.setItem("solar3_snap", JSON.stringify({
      ts: j.ts, day: j.today, now: j.now||{}, intraday: j.intraday||null
    }));
  }catch(e){}   // เต็มก็แค่ไม่มี snapshot ไม่ทำให้หน้าพัง
}
function snapLoad(){
  try{
    var s = JSON.parse(localStorage.getItem("solar3_snap")||"null");
    if(!s) return null;
    if(s.day !== new Date().toISOString().slice(0,10)) return null;   // ข้ามวันแล้ว ทิ้ง
    return s;
  }catch(e){ return null; }
}

/* ===================================================================
   1) utils
   =================================================================== */
function n1(v){ return (v===null||v===undefined||isNaN(v))?null:Math.round(v*10)/10; }
function f(v, dec){ if(v===null||v===undefined||isNaN(v)) return "—";
  return Number(v).toLocaleString("th-TH",{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }
function fw(v){ return v===null||v===undefined||isNaN(v) ? "—" : f(Math.round(v)); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function hhmm(mins){ var h=Math.floor(mins/60), m=mins%60; return ("0"+h).slice(-2)+":"+("0"+m).slice(-2); }
function dLabel(iso){ var p=String(iso).split("-"); return p.length===3 ? (+p[2])+"/"+(+p[1]) : iso; }
function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function socColor(soc){ return soc===null?"var(--muted)":(soc>=50?"var(--good)":(soc>=20?"var(--warn)":"var(--crit)")); }

/* ===================================================================
   2) derive — ทุกตัวเลขที่ไม่ได้มาจาก API ตรง ๆ คำนวณที่เดียวตรงนี้
      กติกา: ค่าที่ "อนุมานเอา" ต้องมีชื่อบอกว่าอนุมาน และต้องโชว์ส่วนต่างเสมอ
   =================================================================== */
function derive(d){
  var w = d.now || {};
  ["soc","batt","pv","load","grid"].forEach(function(k){
    if(w[k]===undefined || w[k]==="" || (typeof w[k]==="number" && isNaN(w[k]))) w[k] = null;
  });
  d.now = w;
  var days = (d.days||[]).map(function(r){
    var o = { date:r[0], gen:r[1], use:r[2], imp:r[3], exp:r[4], chg:r[5], dis:r[6] };
    var use=o.use||0, imp=o.imp||0, dis=o.dis||0, gen=o.gen||0, chg=o.chg||0, exp=o.exp||0;
    o.self = Math.max(0, use - imp - dis);              // แดดที่ใช้ตรงในบ้าน
    o.ss   = use>0 ? (use-imp)/use*100 : null;          // พึ่งตัวเอง %
    o.loss = gen - (o.self + chg + exp);                // ส่วนต่างฝั่งผลิต (แปลงไฟ/วัดคนละจุด)
    o.cost = imp*S.rate;
    o.saved= (o.self + dis)*S.rate;
    return o;
  });
  d._days = days;
  d._byDate = {}; days.forEach(function(x){ d._byDate[x.date]=x; });
  d._today = d._byDate[d.today] || null;
  var it = d.intraday || {t:[]};
  d._intra = it;
  // สถิติในวัน — จาก array ราย 5 นาทีที่ V2 ทิ้งไปทั้งก้อน
  var peak=null, peakAt=null, socMin=null, socMax=null, coverMin=0, lastT=null;
  var gridFreeMin=0, impPeak=null, hasGrid=!!(it.grid && it.grid.length);
  for(var i=0;i<(it.t||[]).length;i++){
    var pv=it.pv[i], ld=it.load[i], sc=it.soc[i], t=it.t[i];
    var gw = hasGrid ? it.grid[i] : null;      // wirePower: บวก = ซื้อเข้า, ลบ = ไหลออก
    if(pv!==null && (peak===null||pv>peak)){ peak=pv; peakAt=t; }
    if(sc!==null){ if(socMin===null||sc<socMin) socMin=sc; if(socMax===null||sc>socMax) socMax=sc; }
    var span = lastT===null ? 0 : Math.min(30, t-lastT);
    if(pv!==null && ld!==null && pv>=ld) coverMin += span;
    if(gw!==null && gw<50) gridFreeMin += span;   // <50W = ถือว่าไม่ได้ซื้อไฟ
    if(gw!==null && (impPeak===null||gw>impPeak)) impPeak = gw;
    lastT = t;
  }
  d._stat = { peak:peak, peakAt:peakAt, socMin:socMin, socMax:socMax, coverMin:coverMin,
              gridFreeMin:gridFreeMin, hasGrid:hasGrid, impPeak:impPeak,
              samples:(it.t||[]).length, lastT:lastT };
  // รอบบิล
  var c = d.cycle||{};
  d._cyc  = cycleStats(days, c.start, c.end, d.today);
  d._prev = cycleStats(days, c.prevStart, c.prevEnd, null);
  return d;
}
function cycleStats(days, start, end, today){
  if(!start) return null;
  var rows = days.filter(function(x){ return x.date>=start && x.date<=end; });
  var done = rows.filter(function(x){ return x.date!==today; });   // วันนี้ยังไม่จบ -> ไม่เอาไปหารเฉลี่ย
  var sum = function(arr,k){ return arr.reduce(function(a,b){ return a+(b[k]||0); },0); };
  var totalDays = Math.round((new Date(end)-new Date(start))/86400000)+1;
  var avgImp = done.length ? sum(done,"imp")/done.length : null;
  return {
    start:start, end:end, rows:rows, days:rows.length, doneDays:done.length, totalDays:totalDays,
    imp:sum(rows,"imp"), exp:sum(rows,"exp"), gen:sum(rows,"gen"), use:sum(rows,"use"),
    self:sum(rows,"self"), dis:sum(rows,"dis"),
    cost:sum(rows,"imp")*S.rate, saved:sum(rows,"saved"),
    avgImp:avgImp,
    projImp: avgImp===null ? null : avgImp*totalDays,
    projCost:avgImp===null ? null : avgImp*totalDays*S.rate,
    missing: totalDays>=rows.length ? 0 : 0
  };
}

/* -------------------------------------------------------------------
   จัดกลุ่มข้อมูลย้อนหลัง — ใช้กับหน้า "ประวัติ"
   วันที่ยังไม่จบ (วันนี้) ติดธง partial ทุกที่ ไม่ถูกนับในค่าเฉลี่ย
   ------------------------------------------------------------------- */
var TH_M = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function monthLabel(ym){ var p=ym.split("-"); return TH_M[+p[1]-1]+" "+String(+p[0]+543).slice(-2); }
function cycleKeyOf(iso, startDay){
  var p = iso.split("-"), y=+p[0], m=+p[1], d=+p[2];
  if(d < startDay){ m--; if(m<1){ m=12; y--; } }
  return y+"-"+("0"+m).slice(-2)+"-"+("0"+startDay).slice(-2);
}
function groupRows(days, mode, today, startDay){
  var src = days, keyOf, labOf;
  if(mode==="30" || mode==="90"){
    src = days.slice(-(+mode));
    keyOf = function(x){ return x.date; };
    labOf = function(k){ return dLabel(k); };
  } else if(mode==="month"){
    keyOf = function(x){ return x.date.slice(0,7); };
    labOf = monthLabel;
  } else {
    keyOf = function(x){ return cycleKeyOf(x.date, startDay||17); };
    // รอบบิลคาบ 2 เดือน — ป้ายต้องบอกทั้งคู่ ไม่งั้นแยกจากมุมมองรายเดือนไม่ออก
    labOf = function(k){ var p=k.split("-"), m=+p[1]-1;
      return TH_M[m]+"→"+TH_M[(m+1)%12]+" "+String(+p[0]+543).slice(-2); };
  }
  var by = {}, order = [];
  src.forEach(function(x){
    var k = keyOf(x);
    if(!by[k]){ by[k] = { key:k, label:labOf(k), gen:0,use:0,imp:0,exp:0,chg:0,dis:0,self:0,
                          nDays:0, partial:false, first:x.date, last:x.date }; order.push(k); }
    var b = by[k];
    b.gen+=x.gen||0; b.use+=x.use||0; b.imp+=x.imp||0; b.exp+=x.exp||0;
    b.chg+=x.chg||0; b.dis+=x.dis||0; b.self+=x.self||0;
    b.nDays++; b.last = x.date;
    if(x.date===today) b.partial = true;
  });
  order.sort();
  return order.map(function(k){
    var b = by[k];
    b.ss = b.use>0 ? (b.use-b.imp)/b.use*100 : null;
    b.cost = b.imp*S.rate; b.saved = (b.self+b.dis)*S.rate;
    return b;
  });
}

/* ===================================================================
   3) chart engine — SVG ล้วน ไม่มี library
      กติกาที่บังคับตัวเองไว้ (skill dataviz):
        • แกน y แกนเดียวต่อ panel เสมอ — kW กับ % อยู่คนละ panel ห้ามรวม
        • เส้น 2px · จุด >=8px · ช่องว่าง 2px ระหว่าง segment ที่ติดกัน
        • grid เส้นบาง สีจาง · ไม่มีตัวเลขบนทุกจุด ติดป้ายเฉพาะจุดที่ต้องอ่าน
   =================================================================== */
function mkSvg(w,h){ return ['<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img">']; }
function chartHost(id){ var el=document.getElementById(id); return el && el.clientWidth>0 ? el : null; }

/* --- 3a) time series (เส้น/พื้นที่) สำหรับกราฟรายช่วงในวัน --- */
function timeSeries(host, cfg){
  var W = host.clientWidth, H = cfg.h||150, P = {t:12,r:8,b:20,l:34};
  var xs = cfg.x, series = cfg.series;
  if(!xs.length){ host.innerHTML = '<div class="empty">'+(cfg.empty||"ยังไม่มีข้อมูล")+'</div>'; return; }
  var xMin = cfg.xMin!==undefined?cfg.xMin:xs[0], xMax = cfg.xMax!==undefined?cfg.xMax:xs[xs.length-1];
  var yMax = cfg.yMax || 0;
  series.forEach(function(s){ s.vals.forEach(function(v){ if(v!==null&&v>yMax) yMax=v; }); });
  yMax = niceMax(yMax);
  var px = function(x){ return P.l + (x-xMin)/(xMax-xMin||1)*(W-P.l-P.r); };
  var py = function(y){ return P.t + (1-(y/(yMax||1)))*(H-P.t-P.b); };
  var o = mkSvg(W,H);

  // grid + y ticks
  var ticks = cfg.yTicks || [0, yMax/2, yMax];
  ticks.forEach(function(v){
    o.push('<line x1="'+P.l+'" y1="'+py(v)+'" x2="'+(W-P.r)+'" y2="'+py(v)+
      '" stroke="var(--line)" stroke-width="1"/>');
    o.push('<text x="'+(P.l-6)+'" y="'+(py(v)+3.5)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">'+
      (cfg.yFmt?cfg.yFmt(v):f(v))+'</text>');
  });
  // x ticks
  (cfg.xTicks||[]).forEach(function(t){
    o.push('<text x="'+px(t.v)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+t.l+'</text>');
  });

  series.forEach(function(s){
    var dLine=[], dArea=[], open=false;
    for(var i=0;i<xs.length;i++){
      var v=s.vals[i];
      if(v===null||v===undefined){ open=false; continue; }
      var X=px(xs[i]).toFixed(1), Y=py(v).toFixed(1);
      if(!open){ dLine.push("M"+X+" "+Y); dArea.push("M"+X+" "+py(0).toFixed(1)+"L"+X+" "+Y); open=true; }
      else { dLine.push("L"+X+" "+Y); dArea.push("L"+X+" "+Y); }
      if(i===xs.length-1) dArea.push("L"+X+" "+py(0).toFixed(1)+"Z");
    }
    if(s.area) o.push('<path d="'+dArea.join("")+'" fill="'+s.color+'" opacity=".16"/>');
    o.push('<path d="'+dLine.join("")+'" fill="none" stroke="'+s.color+
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
  });
  // baseline
  o.push('<line x1="'+P.l+'" y1="'+py(0)+'" x2="'+(W-P.r)+'" y2="'+py(0)+'" stroke="var(--axis)" stroke-width="1"/>');
  // crosshair
  o.push('<line id="'+host.id+'-ch" x1="0" y1="'+P.t+'" x2="0" y2="'+py(0)+
    '" stroke="var(--axis)" stroke-width="1" opacity="0"/>');
  series.forEach(function(s,i){
    o.push('<circle id="'+host.id+'-d'+i+'" r="4.5" fill="'+s.color+
      '" stroke="var(--surface)" stroke-width="2" opacity="0"/>');
  });
  o.push('</svg><div class="tip" id="'+host.id+'-tip"></div>');
  host.innerHTML = o.join("");

  var tip = document.getElementById(host.id+"-tip"), ch = document.getElementById(host.id+"-ch");
  function move(ev){
    var r = host.getBoundingClientRect();
    var mx = (ev.touches?ev.touches[0].clientX:ev.clientX) - r.left;
    var xv = xMin + (mx-P.l)/((W-P.l-P.r)||1)*(xMax-xMin);
    var bi=0, bd=Infinity;
    for(var i=0;i<xs.length;i++){ var dd=Math.abs(xs[i]-xv); if(dd<bd){bd=dd;bi=i;} }
    var X = px(xs[bi]);
    ch.setAttribute("x1",X); ch.setAttribute("x2",X); ch.setAttribute("opacity","1");
    var html = '<b>'+cfg.xLabel(xs[bi])+'</b>';
    series.forEach(function(s,i){
      var v=s.vals[bi], dot=document.getElementById(host.id+"-d"+i);
      if(v===null||v===undefined){ dot.setAttribute("opacity","0"); return; }
      dot.setAttribute("cx",X); dot.setAttribute("cy",py(v)); dot.setAttribute("opacity","1");
      html += '<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+
        s.color+';margin-right:5px"></i>'+s.name+' <b>'+(cfg.vFmt?cfg.vFmt(v):f(v))+'</b>';
    });
    tip.innerHTML = html; tip.classList.add("on");
    var tw = tip.offsetWidth;
    tip.style.left = Math.max(2, Math.min(W-tw-2, X-tw/2))+"px";
    tip.style.top  = "0px";
  }
  function out(){ tip.classList.remove("on"); ch.setAttribute("opacity","0");
    series.forEach(function(s,i){ document.getElementById(host.id+"-d"+i).setAttribute("opacity","0"); }); }
  host.addEventListener("pointermove", move);
  host.addEventListener("pointerleave", out);
  host.addEventListener("touchmove", function(e){ move(e); }, {passive:true});
  host.addEventListener("touchend", out);
}

/* --- 3b) bar / stacked bar รายวัน --- */
function bars(host, cfg){
  var W = host.clientWidth, H = cfg.h||140, P={t:12,r:6,b:18,l:30};
  var lab = cfg.labels, ser = cfg.series;
  if(!lab.length){ host.innerHTML='<div class="empty">'+(cfg.empty||"ยังไม่มีข้อมูล")+'</div>'; return; }
  var totals = lab.map(function(_,i){
    return cfg.stacked ? ser.reduce(function(a,s){ return a+(s.vals[i]||0); },0)
                       : Math.max.apply(null, ser.map(function(s){ return s.vals[i]||0; }));
  });
  var yMax = niceMax(Math.max.apply(null, totals));
  var bw = (W-P.l-P.r)/lab.length;
  var innerW = Math.max(2, Math.min(cfg.maxBar||26, bw-2));
  var py = function(y){ return P.t + (1-(y/(yMax||1)))*(H-P.t-P.b); };
  var o = mkSvg(W,H);
  [0, yMax/2, yMax].forEach(function(v){
    o.push('<line x1="'+P.l+'" y1="'+py(v)+'" x2="'+(W-P.r)+'" y2="'+py(v)+'" stroke="var(--line)"/>');
    o.push('<text x="'+(P.l-5)+'" y="'+(py(v)+3.5)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">'+
      f(v, yMax<10?1:0)+'</text>');
  });
  if(cfg.refLine!==undefined && cfg.refLine!==null){
    o.push('<line x1="'+P.l+'" y1="'+py(cfg.refLine)+'" x2="'+(W-P.r)+'" y2="'+py(cfg.refLine)+
      '" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" opacity=".65"/>');
    o.push('<text x="'+(W-P.r)+'" y="'+(py(cfg.refLine)-4)+'" text-anchor="end" font-size="9.5" fill="var(--ink-2)">'+
      esc(cfg.refLabel||"")+'</text>');
  }
  var grouped = !cfg.stacked && ser.length>1;          // หลาย series หน่วยเดียวกัน -> วางข้างกัน
  lab.forEach(function(L,i){
    var x0 = P.l + bw*i + (bw-innerW)/2, acc = 0;
    var partial = cfg.partialIdx===i;
    var gw = grouped ? Math.max(1.5, (innerW-2*(ser.length-1))/ser.length) : innerW;
    ser.forEach(function(s, si){
      var v = s.vals[i]; if(v===null||v===undefined||v<=0) return;
      var x = grouped ? x0 + si*(gw+2) : x0;
      var y0 = py(acc), y1 = py(acc+v), h = Math.max(1, y0-y1-(cfg.stacked?2:0));
      o.push('<rect x="'+x.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+gw.toFixed(1)+
        '" height="'+h.toFixed(1)+'" rx="2.5" fill="'+s.color+'"'+
        (partial?' opacity=".55" stroke="'+s.color+'" stroke-width="1" stroke-dasharray="2 2"':'')+'/>');
      if(cfg.stacked) acc += v;
    });
    o.push('<rect class="hit" data-i="'+i+'" x="'+(P.l+bw*i)+'" y="'+P.t+'" width="'+bw+
      '" height="'+(H-P.t-P.b)+'" fill="transparent"/>');
  });
  var step = Math.ceil(lab.length/6);
  lab.forEach(function(L,i){
    if(i%step) return;
    o.push('<text x="'+(P.l+bw*i+bw/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+
      esc(L)+'</text>');
  });
  o.push('<line x1="'+P.l+'" y1="'+py(0)+'" x2="'+(W-P.r)+'" y2="'+py(0)+'" stroke="var(--axis)"/>');
  o.push('</svg><div class="tip" id="'+host.id+'-tip"></div>');
  host.innerHTML = o.join("");
  var tip = document.getElementById(host.id+"-tip");
  host.addEventListener("pointermove", function(ev){
    var t = ev.target.closest ? ev.target.closest(".hit") : null;
    if(!t){ tip.classList.remove("on"); return; }
    var i = +t.getAttribute("data-i");
    var html = '<b>'+esc(cfg.tipLabel?cfg.tipLabel(i):lab[i])+'</b>';
    ser.forEach(function(s){
      var v=s.vals[i]; if(v===null||v===undefined) return;
      html += '<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+
        s.color+';margin-right:5px"></i>'+s.name+' <b>'+f(v,1)+(cfg.unit||"")+'</b>';
    });
    if(cfg.partialIdx===i) html += '<br><span style="color:var(--muted)">⧗ วันนี้ยังไม่จบ</span>';
    tip.innerHTML = html; tip.classList.add("on");
    var X = P.l + bw*i + bw/2, tw = tip.offsetWidth;
    tip.style.left = Math.max(2, Math.min(W-tw-2, X-tw/2))+"px"; tip.style.top="0px";
  });
  host.addEventListener("pointerleave", function(){ tip.classList.remove("on"); });
}
function niceMax(v){
  if(!v||v<=0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log10(v))), n = v/mag;
  var step = n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
  return step*mag;
}

/* --- 3c) SOC ring --- */
function ring(soc){
  var R=48, C=2*Math.PI*R, pct=(soc===null?0:Math.max(0,Math.min(100,soc)));
  var col = socColor(soc);
  // 2026-09-22 ปล่อยให้ CSS คุมขนาดกล่อง (ย่อโดนัทลงโดยไม่ต้องแก้ค่าในนี้)
  return '<div class="ring"><svg viewBox="0 0 108 108" width="100%" height="100%">'+
    '<circle cx="54" cy="54" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="9"/>'+
    '<circle cx="54" cy="54" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round"'+
    ' stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 54 54)"/>'+
    // 2026-09-22 รอบ 2: "Battery" กลับเข้ามาอยู่ "เหนือตัวเลข %" ในโดนัท
    //            เพราะตอนวางไว้ซ้ายการ์ด เหลือที่ว่างเยอะเกิน (Napon สั่ง)
    '</svg><div class="val"><span class="rname">Battery</span>'+

}

/* --- 3d) power flow — ผังไฟวิ่ง แดด/แบต/บ้าน/กริด ---
   🔴 ทิศทางไม่ได้ตายตัว ต้องอ่านจากเครื่องหมายของค่าจริงทุกครั้ง:
     batt < 0 = ชาร์จเข้าแบต (ไฟไหลจากฮับไปแบต) · batt > 0 = แบตจ่ายออก
     grid > 0 = ซื้อจากกริด (ไหลเข้าบ้าน)        · grid < 0 = ไหลออกกริด
   ต่ำกว่า 20 W ถือว่านิ่ง — ไม่วิ่ง เพราะ sensor แกว่งระดับนั้นเป็นปกติ */
/* 2026-09-22 รื้อผังใหม่ตามที่ Napon สั่ง:
     - ตัวหนังสือย้ายออก "ด้านนอก" ของไอคอน — ซ้ายของโหนดซ้าย · ขวาของโหนดขวา
       (เดิมอยู่ใต้ไอคอน ทำให้ผังสูงและตัวเลขเล็ก)
     - ขนาดตัวเลขเท่ากันทั้ง 4 โหนด ("ใหญ่ขึ้นให้เท่ากับในกลุ่ม")
     - เส้นเปลี่ยนจากทแยงเป็น "หักฉาก" แนวนอน+แนวดิ่ง และหนาขึ้น
   🔑 ฮับเป็นสี่เหลี่ยม ไม่ใช่วงกลม เพราะต้องมีจุดเข้า 4 จุดแยกกัน
      ถ้าใช้วงกลม เส้นซ้ายบน/ซ้ายล่างจะวิ่งทับกันจนแยกไม่ออกว่าอันไหนคืออันไหน */
var PF_R = 26;
var PF_HUB = { x:186, y:112, w:46, h:50 };          // กึ่งกลาง + ขนาดกล่องฮับ
var PF_POS = { sun:[118,40], grid:[254,40], batt:[118,184], home:[254,184] };
/* ทางเดินของแต่ละเส้น เรียงจาก "โหนด -> ฮับ" · คนละ corridor กัน ไม่ทับกันสักเส้น */
/* 2026-09-22 รอบ 3 (Napon สั่ง): "แดด" กับ "กริด" กลับไปเป็นเส้นเฉียงแบบเดิม
   ส่วน "แบต" กับ "บ้าน" คงเป็นหักฉาก ⇒ ผังผสม 2 แบบตามที่สั่ง
   viewBox 344 -> 372 อีกรอบ เพราะฟอนต์ใหญ่ขึ้น ต้องการช่องข้อความ 82 หน่วย (เดิม 68)
   ไม่งั้น "3,200 W" ที่ 19px จะล้นออกนอกกรอบ */
var PF_PATH = {
  batt: [[144,184],[175,184],[175,137]],
  home: [[228,184],[197,184],[197,137]]
};

/** เส้นเฉียง: จากขอบโหนดตรงไปขอบกล่องฮับ — คำนวณจุดตัดกับกรอบสี่เหลี่ยมของฮับ
 *  คืนค่าเรียง "โหนด -> ฮับ" (กลับ array เมื่อไฟไหลอีกทาง เหมือนเส้นหักฉาก) */
function pfDiag(n){
  var hx=PF_HUB.x, hy=PF_HUB.y, dx=n[0]-hx, dy=n[1]-hy;
  var L=Math.sqrt(dx*dx+dy*dy), ux=dx/L, uy=dy/L;
  var t=Math.min((PF_HUB.w/2+4)/Math.abs(dx), (PF_HUB.h/2+4)/Math.abs(dy));
  return [[ +(n[0]-ux*(PF_R+4)).toFixed(1), +(n[1]-uy*(PF_R+4)).toFixed(1) ],
          [ +(hx+dx*t).toFixed(1),          +(hy+dy*t).toFixed(1) ]];
}
PF_PATH.sun  = pfDiag(PF_POS.sun);
PF_PATH.grid = pfDiag(PF_POS.grid);

/** pts = ทางเดินเรียงตามทิศไฟจริง (กลับด้าน array = กลับทิศวิ่ง) */
function pfEdge(pts, col, watt){
  var d = 'M'+pts[0][0]+' '+pts[0][1];
  for(var i=1;i<pts.length;i++) d += 'L'+pts[i][0]+' '+pts[i][1];
  var s = '<path class="pf-line" d="'+d+'" stroke="'+col+'"/>';
  if(watt!==null && watt!==undefined && !isNaN(watt) && Math.abs(watt)>=20){
    // 3000 W -> ~0.55s (เร็ว) · 100 W -> ~2.9s (ช้า) — เห็นความต่างของกำลังไฟได้จากจังหวะ
    var sp = Math.max(0.55, Math.min(3.0, 3.0 - Math.abs(watt)/1150));
    s += '<path class="pf-dash" d="'+d+'" stroke="'+col+'" style="--sp:'+sp.toFixed(2)+'s"/>';
  }
  return s;
}

/** side = "left" -> ตัวหนังสืออยู่ซ้ายของไอคอน (ชิดขวา) · "right" -> อยู่ขวา (ชิดซ้าย) */
function pfNode(p, icon, label, val, col, on, side){
  var left = (side === "left");
  var tx = left ? (p[0]-PF_R-10) : (p[0]+PF_R+10);
  var anc = left ? "end" : "start";
  return '<g class="'+(on?'':'pf-off')+'">'
    + '<circle class="pf-node" cx="'+p[0]+'" cy="'+p[1]+'" r="'+PF_R+'"/>'
    + '<g transform="translate('+(p[0]-20)+','+(p[1]-20)+') scale(1.25)">'+icon+'</g>'
    + '<text class="pf-lab" x="'+tx+'" y="'+(p[1]-4)+'" text-anchor="'+anc+'">'+label+'</text>'
    + '<text class="pf-val" x="'+tx+'" y="'+(p[1]+15)+'" text-anchor="'+anc+'" fill="'+col+'">'
    +   val+'<tspan class="pf-u"> W</tspan></text></g>';
}

function pfIconSun(c){
  var r='';
  for(var i=0;i<8;i++){
    var a=i*Math.PI/4;
    r += '<line x1="'+(16+Math.cos(a)*10.5).toFixed(1)+'" y1="'+(16+Math.sin(a)*10.5).toFixed(1)
       + '" x2="'+(16+Math.cos(a)*14.5).toFixed(1)+'" y2="'+(16+Math.sin(a)*14.5).toFixed(1)+'"/>';
  }
  return '<g class="pf-rays" stroke="'+c+'" stroke-width="2" stroke-linecap="round">'+r+'</g>'
       + '<circle cx="16" cy="16" r="6.4" fill="'+c+'"/>';
}
function pfIconBatt(c, soc){
  var h = soc===null ? 0 : Math.max(0, Math.min(1, soc/100)) * 13.4;
  return '<rect x="11.5" y="6" width="9" height="3.2" rx="1.4" fill="'+c+'"/>'
       + '<rect x="8" y="9.2" width="16" height="18.4" rx="3.4" fill="none" stroke="'+c+'" stroke-width="2"/>'
       + (h>0 ? '<rect x="10.5" y="'+(25.1-h).toFixed(1)+'" width="11" height="'+h.toFixed(1)+'" rx="1.6" fill="'+c+'"/>' : '');
}
function pfIconHome(c){
  return '<g fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">'
       + '<path d="M5 16.5 L16 7 L27 16.5"/><path d="M8.5 15.2 V26 H23.5 V15.2"/>'
       + '<path d="M13.6 26 V20.2 H18.4 V26"/></g>';
}
function pfIconGrid(c){
  return '<g fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">'
       + '<path d="M9 27 L14 8 M23 27 L18 8 M14 8 H18"/>'
       + '<path d="M12.4 14 H19.6 M10.9 20 H21.1 M12.4 14 L19.6 20 M19.6 14 L12.4 20"/></g>';
}
function pfIconHub(c){
  return '<path d="M17.8 7 L10 17.6 H15.2 L14.2 25 L22 14.4 H16.8 Z" fill="'+c+'"/>';
}

/* --- 3e) ไอคอนแบตในกล่อง "ชาร์จ/จ่าย" ---
   แบตวางซ้าย ลูกศรอยู่ขวา ⇒ ชี้ซ้าย = ไฟเข้าแบต · ชี้ขวา = ดึงออกจากแบต
   ระดับไฟในไอคอน = SOC จริง (ไม่ใช่ภาพประกอบลอย ๆ) · สีรับจาก --tc ของกล่อง = สีเดียวกับเส้นในผังไฟวิ่ง
   เกณฑ์ 20 W และสูตรความเร็วใช้ชุดเดียวกับ pflow() — สองที่ต้องเล่าเรื่องเดียวกันเสมอ */
function battChip(batt, soc){
  var on  = batt!==null && batt!==undefined && !isNaN(batt) && Math.abs(batt)>20;
  var chg = on && batt<0;
  var lvl = (soc===null||soc===undefined||isNaN(soc)) ? 0 : Math.max(0,Math.min(100,soc));
  var w   = 38*lvl/100;
  var sp  = on ? Math.max(0.50, Math.min(2.4, 2.4 - Math.abs(batt)/1400)) : 1.3;
  var chev = '';
  if(on){
    var d = chg ? 'M5 -6 L-1 0 L5 6' : 'M-1 -6 L5 0 L-1 6';
    for(var i=0;i<3;i++)
      // 🔴 ต้องห่อ <g> แล้วขยับ <path> ข้างใน — CSS transform ของแอนิเมชัน "ทับ" attribute
      //    transform ของ SVG ทั้งอัน (ไม่ใช่บวกกัน) ถ้าใส่ไว้ที่ path เดียวกัน ลูกศรจะกระโดด
      //    ไปมุมซ้ายบนแล้วหลุดออกนอก viewBox = หายไปเงียบ ๆ (เจอจริง 22 ก.ย. 2026 ตอนเปิดดูบนจอ)
      // 🔵 delay ใส่ inline ไม่ใช้ :nth-of-type เพราะตอนนี้แต่ละ path อยู่คนละ <g> แล้ว
      chev += '<g transform="translate('+(60+i*12)+' 16)">'
           +  '<path class="bchev" d="'+d+'" style="animation-delay:'+(sp*i/3).toFixed(2)+'s"'
           +  ' fill="none" stroke="var(--tc)" stroke-width="2.4"'
           +  ' stroke-linecap="round" stroke-linejoin="round"/></g>';
  }
  return '<svg class="bchip'+(chg?' in':'')+'" viewBox="0 0 96 32" aria-hidden="true"'
    + ' style="--sp:'+sp.toFixed(2)+'s">'
    + '<rect x="2" y="5" width="44" height="22" rx="5.5" fill="none" stroke="var(--tc)" stroke-width="2.2"/>'
    + '<rect x="47.5" y="12" width="4" height="8" rx="1.6" fill="var(--tc)"/>'
    + (w>0 ? '<rect x="5.5" y="8.5" width="'+w.toFixed(1)+'" height="15" rx="2.6" fill="var(--tc)"/>' : '')
    + chev + '</svg>';
}

function pflow(pv, load, batt, grid, soc){
  var P=PF_POS, gridOut = (grid!==null && grid<0);
  var cSun='var(--solar)', cBatt='var(--batt)', cHome='var(--home)',
      cGrid = gridOut ? 'var(--export)' : 'var(--grid)';
  var on = function(v){ return v!==null && v!==undefined && !isNaN(v) && Math.abs(v)>=20; };

  var rev = function(a){ return a.slice().reverse(); };     // กลับทิศวิ่งของเส้น
  var e = pfEdge(PF_PATH.sun, cSun, pv)                            // แดดเข้าเสมอ
        + pfEdge(rev(PF_PATH.home), cHome, load)                   // บ้านออกเสมอ (ฮับ -> บ้าน)
        + (batt!==null && batt<0 ? pfEdge(rev(PF_PATH.batt), cBatt, batt)  // ชาร์จ: ฮับ -> แบต
                                 : pfEdge(PF_PATH.batt, cBatt, batt))      // จ่ายออก: แบต -> ฮับ
        + (gridOut ? pfEdge(rev(PF_PATH.grid), cGrid, grid)                // ไหลออกกริด: ฮับ -> กริด
                   : pfEdge(PF_PATH.grid, cGrid, grid));                   // ซื้อ: กริด -> ฮับ

  var H = PF_HUB;
  return '<div class="pflow"><svg viewBox="0 0 372 224" role="img" aria-label="ผังทิศทางไฟตอนนี้">'
    + e
    + '<rect class="pf-node" x="'+(H.x-H.w/2)+'" y="'+(H.y-H.h/2)+'" width="'+H.w+'" height="'+H.h+'" rx="13"/>'
    + '<g transform="translate('+(H.x-20)+','+(H.y-20)+') scale(1.25)">'+pfIconHub('var(--ink-2)')+'</g>'
    + pfNode(P.sun,  pfIconSun(cSun),  'แดด', fw(pv), cSun, on(pv), "left")
    + pfNode(P.batt, pfIconBatt(cBatt, soc),
        (batt!==null&&batt<0?'ชาร์จเข้าแบต':'จากแบต'),
        (batt===null?'—':fw(Math.abs(batt))), cBatt, on(batt), "left")
    + pfNode(P.grid, pfIconGrid(cGrid),
        (grid===null?'กริด':(gridOut?'ไหลออกกริด':'ซื้อจากกริด')),
        (grid===null?'—':fw(Math.abs(grid))), cGrid, on(grid), "right")
    + pfNode(P.home, pfIconHome(cHome), 'บ้าน', fw(load), cHome, on(load), "right")
    + '</svg></div>';
}

/* ===================================================================
   4) views
   =================================================================== */
/* tone = ความหมายของตัวเลข ไม่ใช่ตำแหน่ง: good(เขียว) · gen(เหลือง) · self(น้ำเงิน) · cost(แดง)
   ไม่ส่ง tone = การ์ดสีกลาง ใช้กับตัวเลขที่ไม่ใช่เรื่องพลังงาน (ขนาดคลัง · วันที่ขาด) */
function tile(l, v, u, s, tone){
  return '<div class="tile'+(tone?' t t-'+tone:'')+'"><div class="l">'+l+'</div><div class="v">'+v+
    (u?'<u>'+u+'</u>':'')+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';
}

/* ---------- 4a) ตอนนี้ ---------- */
function viewNow(d){
  var w = d.now||{}, st = d._stat, t = d._today;
  var soc=w.soc, batt=w.batt, pv=w.pv, load=w.load, grid=w.grid;
  var state = batt===null ? "—" : (batt<-20?"กำลังชาร์จ":(batt>20?"กำลังจ่ายไฟ":"นิ่ง"));
  var col = socColor(soc);

  /* 2026-09-22 ทิศของแบตอ่านจากเครื่องหมายของ batt ที่เดียว (batt<0 = ชาร์จเข้า)
     เขียว = ไฟเข้าแบต · แดง = ดึงออกจากแบต — สีชุดเดียวกับเส้นในผังไฟวิ่ง ไม่ให้แปลคนละอย่างในหน้าเดียว
     ต่ำกว่า 20 W ถือว่านิ่ง ตามเกณฑ์เดียวกับ pflow() เพราะ sensor แกว่งระดับนั้นเป็นปกติ */
  var bCol = (batt===null || Math.abs(batt)<=20) ? "var(--muted)"
           : (batt<0 ? "var(--batt)" : "var(--grid)");
  // 2026-09-22 ตัด bLbl/bSign ("+ เข้าแบต" / "− ออกจากแบต") ทิ้ง — Napon สั่งเอาบรรทัดนั้นออก
  // เหลือ bCol ตัวเดียวที่ยังใช้ ⇒ ไม่ปล่อยตัวแปรตายค้างไว้ในไฟล์

  // เวลาที่แบตอยู่ได้ — ต้องรู้ความจุแบตก่อน ไม่รู้ = ไม่เดา
  var runtime = "";
  if(S.cap>0 && batt!==null && batt>20 && soc!==null){
    var usable = (soc-20)/100*S.cap;                  // กันไว้ 20% ตามอายุแบต
    var hrs = usable/(batt/1000);
    runtime = tile("แบตอยู่ได้อีก", f(Math.floor(hrs))+":"+("0"+Math.round((hrs%1)*60)).slice(-2), "ชม.", "ที่โหลดตอนนี้ · เหลือถึง 20%", "good");
  } else if(S.cap>0 && batt!==null && batt<-20 && soc!==null){
    var need=(100-soc)/100*S.cap, h2=need/(-batt/1000);
    runtime = tile("เต็มในอีก", f(Math.floor(h2))+":"+("0"+Math.round((h2%1)*60)).slice(-2), "ชม.", "ที่อัตราชาร์จตอนนี้", "good");
  }

  // ป้าย/ทิศของกริดย้ายไปอยู่ใน pflow() แล้ว — อ่านจากเครื่องหมายของ grid ที่เดียว ไม่ให้แตกเป็น 2 ที่

  return ''
  + '<div class="card">'
  //      2026-09-22 "Battery" ย้ายมาอยู่ซ้ายสุด จัดกึ่งกลางแนวตั้งให้ตรงกลางโดนัท (Napon สั่ง)
  //      ได้ความสูงคืนมาด้วย เพราะไม่ต้องเสียบรรทัดหัวข้อเต็มแถวอีกแล้ว
  /* 2026-09-22 โครง 3 คอลัมน์ตามสเก็ตช์ที่ Napon ส่งมา:
       ซ้าย   = Battery + โดนัท + สูงสุดวันนี้
       กลาง   = ชาร์จ/จ่าย จากแบต — กล่องเดียวสูงเต็ม (ป้าย · ตัวเลข · +/− จากแบต)
       ขวา    = ผลิตแล้ว (บน) · ซื้อไฟแล้ว (ล่าง)
     🔵 ตัด "ต่ำสุด" ออกแล้วตั้งแต่รอบก่อน — ค่าเดิมทุกวัน ไม่ได้บอกอะไรใหม่ */
  +   '<div class="hero">'
  +     '<div class="heroL">'
  +       '<div class="ringWrap">'+ring(soc)
  +         '<div class="mx">สูงสุดวันนี้ '+f(st.socMax)+'%</div>'
  +       '</div>'
  +     '</div>'
  //     2026-09-22 ตัดบรรทัด "+ เข้าแบต / − ออกจากแบต" ออกตามที่ Napon สั่ง
  //     🔵 ทิศทางไม่ได้หายไปไหน — ลูกศรในไอคอนแบตกับสีของกล่องบอกอยู่แล้ว (เขียว=เข้า · แดง=ออก)
  +     '<div class="tile t tb" style="--tc:'+bCol+'">'
  +       '<div class="l">ชาร์จ/จ่าย</div>'
  +       battChip(batt, soc)
  +       '<div class="v">'+(batt===null?"—":fw(Math.abs(batt)))+'<u>W</u></div>'
  +     '</div>'
  +     '<div class="heroR">'
  +       tile("ผลิตแล้ว", f(t?t.gen:null,1), "kWh", null, "self")
  +       tile("ซื้อไฟแล้ว", f(t?t.imp:null,1), "kWh", t?("≈ ฿"+f(t.imp*S.rate,0)):null, "cost")
  +     '</div>'
  +   '</div>'
  + '</div>'

  + '<div class="card">'
  +   '<h2>ทิศทางไฟ<span class="badge">ตอนนี้</span></h2>'
  // 2026-09-22 เอาคำอธิบาย "ค่ากริดคำนวณจากสมดุล…" ออก — Napon สั่ง ให้พอดีจอมือถือไม่ต้องเลื่อน
  // 🔵 ตัดได้โดยไม่เสียความถูกต้อง เพราะข้อความนั้นพูดแบบเหมารวมทั้งที่ getData_() อ่าน wirePower
  //    จาก Deye ก่อนเสมอ (ดู meta.gridFrom) จะคำนวณจากสมดุลเฉพาะตอนไม่มีค่านั้น
  +   pflow(pv, load, batt, grid, soc)
  + '</div>'

  + '<div class="card">'
  +   '<h2>วันนี้ถึงตอนนี้</h2>'
  +   '<div class="tiles">'
  +     (st.hasGrid
      ? tile("ไม่ซื้อไฟจากกริดเลย", f(st.gridFreeMin/60,1), "ชม.", "วัดจากมิเตอร์ราย 5 นาที (<50 W)", "good")
      : tile("แดดคลุมบ้านได้เอง", f(st.coverMin/60,1), "ชม.", "ช่วงที่ผลิต ≥ ที่ใช้", "good"))
  +     tile("ผลิตสูงสุด", fw(st.peak), "W", st.peakAt===null?"—":"เวลา "+hhmm(st.peakAt), "gen")
  //      2026-09-22 "ผลิตแล้ว" กับ "ซื้อไฟแล้ว" ย้ายขึ้นไปอยู่ขวามือของการ์ด Battery แล้ว
  +   (runtime||"")
  +   '</div>'
  +   (S.cap>0?"":'<p class="note">ใส่ความจุแบต (kWh) ที่ ⚙ แล้วจะคำนวณ "แบตอยู่ได้อีกกี่ชั่วโมง" ให้</p>')
  + '</div>';
}

/* ---------- 4b) วันนี้ ---------- */
function viewDay(d){
  var t = d._today, st = d._stat;
  var partial = st.lastT!==null ? "ข้อมูลถึง "+hhmm(st.lastT) : "";
  var h = ''
  + '<div class="card">'
  +   '<h2>กำลังไฟตลอดวัน<span class="badge">'+esc(partial)+'</span></h2>'
  +   '<p class="why">เส้นที่ <b>แดดอยู่เหนือบ้าน</b> คือช่วงที่ไม่ต้องแตะไฟกริด ส่วนที่แดดต่ำกว่า คือช่วงที่แบตหรือกริดต้องเข้ามาช่วย</p>'
  +   '<div class="chart" id="cPow"></div>'
  +   '<div class="legend"><span><i style="background:var(--solar)"></i>แดดผลิต</span>'
  +     '<span><i style="background:var(--home)"></i>บ้านใช้</span></div>'
  + '</div>'
  + '<div class="card">'
  +   '<h2>ระดับแบตตลอดวัน</h2>'
  +   '<p class="why">แยก panel เพราะหน่วยคนละอย่าง (% กับ W) — เอามารวมแกนเดียวกันเมื่อไหร่ กราฟจะโกหกทันที</p>'
  +   '<div class="chart" id="cSoc"></div>'
  + '</div>';

  if(!t){
    return h + '<div class="card"><div class="empty">ยังไม่มีสรุปรายวันของวันนี้จาก Deye<br>(ตัวเลขรายวันจะขึ้นหลังมีข้อมูลสะสมพอ)</div></div>';
  }
  var self=t.self, dis=t.dis||0, imp=t.imp||0, chg=t.chg||0, exp=t.exp||0, gen=t.gen||0, use=t.use||0;
  var loss = t.loss;
  var lossPct = gen>0 ? Math.abs(loss)/gen*100 : 0;
  var ok = lossPct<=8;

  h += '<div class="card">'
  +  '<h2>วันนี้ไฟมาจากไหน ไปไหน</h2>'
  +  '<p class="why">แถวบน = ของที่ผลิตได้ถูกใช้ไปทางไหน · แถวล่าง = ไฟที่บ้านใช้มาจากไหน</p>'
  +  '<div class="bal">'
  +    balRow("ผลิตได้", gen, [
         {n:"ใช้ตรง", v:self, c:"var(--solar)"},
         {n:"เข้าแบต", v:chg, c:"var(--batt)"},
         {n:"ออกกริด", v:exp, c:"var(--export)"},
         {n:"ส่วนต่าง", v:Math.max(0,loss), c:"var(--line)", dim:true}])
  +    balRow("บ้านใช้", use, [
         {n:"แดด", v:self, c:"var(--solar)"},
         {n:"แบต", v:dis, c:"var(--batt)"},
         {n:"กริด", v:imp, c:"var(--grid)"}])
  +  '</div>'
  +  '<div class="recon"><span class="st" style="color:'+(ok?"var(--good)":"var(--warn)")+'">'+(ok?"✓":"⚠")+'</span>'
  +    '<span>ผลิต '+f(gen,1)+' = ใช้ตรง '+f(self,1)+' + เข้าแบต '+f(chg,1)+' + ออกกริด '+f(exp,1)
  +    ' <b>+ ส่วนต่าง '+f(loss,1)+' kWh ('+f(lossPct,0)+'%)</b>'
  +    (ok?" — อยู่ในช่วงปกติของการแปลงไฟ":" — สูงผิดปกติ ควรเช็คว่า field ไหนนับซ้ำ/ขาด")+'</span></div>'
  +  '<div class="tiles c3" style="margin-top:10px">'
  +    tile("พึ่งตัวเอง", t.ss===null?"—":f(t.ss,0), "%", "(ใช้-ซื้อ)÷ใช้", "self")
  +    tile("ประหยัดได้", "฿"+f(t.saved,0), "", "แดด+แบต × ฿"+S.rate, "good")
  +    tile("ค่าไฟที่จ่าย", "฿"+f(t.cost,0), "", f(imp,1)+" kWh", "cost")
  +  '</div>'
  +  (chg>0?'<p class="note">วนแบตวันนี้: เข้า '+f(chg,1)+' kWh ออก '+f(dis,1)+' kWh ('+
      f(dis/chg*100,0)+'% round-trip)</p>':'')
  + '</div>';
  return h;
}
function balRow(title, total, segs){
  var sum = segs.reduce(function(a,s){ return a+(s.v||0); },0) || 1;
  var h = '<div class="row"><div class="cap"><span>'+title+'</span><b>'+f(total,1)+' kWh</b></div><div class="track">';
  segs.forEach(function(s){
    if(!s.v || s.v<=0) return;
    var pct = s.v/sum*100;
    var label = pct>=17 ? s.n+' '+f(s.v,1) : (pct>=9 ? f(s.v,1) : '');
    h += '<div class="seg'+(s.dim?' dim':'')+'" style="background:'+s.c+';width:'+pct.toFixed(2)+'%" '+
         'title="'+esc(s.n)+' '+f(s.v,1)+' kWh">'+label+'</div>';
  });
  h += '</div></div>';
  return h;
}

/* ---------- 4c) รอบบิล ---------- */
function viewCycle(d){
  var c = d._cyc, p = d._prev;
  if(!c || !c.rows.length){
    return '<div class="card"><div class="empty">ยังไม่มีข้อมูลในรอบบิลนี้<br>รอบ '+
      esc((d.cycle||{}).start||"?")+' → '+esc((d.cycle||{}).end||"?")+'</div></div>';
  }
  var elapsed = c.doneDays, remain = c.totalDays - c.rows.length;
  var pctTime = Math.round(c.rows.length/c.totalDays*100);
  // เทียบรอบก่อน ณ จำนวนวันเท่ากัน — ไม่ใช่เทียบยอดเต็มรอบกับรอบที่ยังไม่จบ
  var pSame = p ? p.rows.slice(0, c.rows.length).reduce(function(a,b){ return a+(b.imp||0); },0) : null;
  var diff  = pSame===null ? null : c.imp - pSame;

  var h = ''
  + '<div class="card">'
  +   '<h2>รอบบิล '+esc(dLabel(c.start))+' → '+esc(dLabel(c.end))+
        '<span class="badge">วันที่ '+c.rows.length+'/'+c.totalDays+'</span></h2>'
  +   '<p class="why">รอบบิล PEA 17 → 16 · ตัวเลขนี้คือ <b>หน่วยที่ซื้อจากกริด</b> ซึ่งเป็นตัวที่ขึ้นบิลจริง</p>'
  +   '<div class="tiles">'
  +     tile("ซื้อแล้วในรอบนี้", f(c.imp,1), "kWh", "เฉลี่ย "+f(c.avgImp,1)+" kWh/วัน", "cost")
  +     tile("ค่าไฟสะสม", "฿"+f(c.cost,0), "", "ที่ ฿"+S.rate+"/kWh", "cost")
  +     tile("ประมาณการทั้งรอบ", c.projImp===null?"—":f(c.projImp,0), "kWh", "🔴 คาดจากค่าเฉลี่ย "+elapsed+" วันที่จบแล้ว", "cost")
  +     tile("ค่าไฟคาดทั้งรอบ", c.projCost===null?"—":"฿"+f(c.projCost,0), "", "เหลืออีก "+remain+" วัน", "cost")
  +   '</div>'
  +   '<div class="recon"><span class="st">i</span><span>ประมาณการใช้วิธีเส้นตรง: เฉลี่ยต่อวัน × '+c.totalDays+
        ' วัน · <b>ไม่รวมวันนี้</b> (ยังไม่จบวัน) และไม่ได้ปรับตามฤดู/วันหยุด</span></div>'
  + '</div>'

  + '<div class="card">'
  +   '<h2>เทียบรอบที่แล้ว ณ วันเดียวกัน'+(diff===null?'':'<span class="badge" style="color:'+
        (diff<=0?"var(--good)":"var(--crit)")+'">'+(diff<=0?"▼":"▲")+' '+f(Math.abs(diff),1)+' kWh</span>')+'</h2>'
  +   (pSame===null
      ? '<div class="empty">ยังไม่มีข้อมูลรอบก่อนพอให้เทียบ</div>'
      : '<div class="tiles"><div class="tile"><div class="l">รอบนี้ '+c.rows.length+' วันแรก</div>'
        + '<div class="v" style="color:var(--grid)">'+f(c.imp,1)+'<u> kWh</u></div>'
        + '<div class="s">฿'+f(c.imp*S.rate,0)+'</div></div>'
        + '<div class="tile"><div class="l">รอบก่อน '+c.rows.length+' วันแรก</div>'
        + '<div class="v" style="color:var(--muted)">'+f(pSame,1)+'<u> kWh</u></div>'
        + '<div class="s">฿'+f(pSame*S.rate,0)+'</div></div></div>')
  + '</div>'

  + '<div class="card">'
  +   '<h2>ซื้อไฟรายวันในรอบนี้</h2>'
  +   '<p class="why">แท่งประคือวันนี้ ยังไม่จบวัน จึงไม่ถูกเอาไปหารค่าเฉลี่ย</p>'
  +   '<div class="chart" id="cCyc"></div>'
  +   '<div class="legend"><span><i style="background:var(--grid)"></i>ซื้อจากกริด (kWh)</span>'
  +     '<span style="color:var(--muted)">- - เฉลี่ยต่อวัน</span></div>'
  + '</div>'

  + '<div class="card">'
  +   '<h2>ย้อนหลังทุกรอบบิล<span class="badge" id="cycN"></span></h2>'
  +   '<p class="why">ตัวที่ใช้ตัดสินว่าระบบคุ้มขึ้นจริงไหม คือแท่งแดง (หน่วยที่ยังต้องซื้อ) ไม่ใช่แท่งผลิต</p>'
  +   '<div class="chart" id="cCycAll"></div>'
  +   '<div class="legend"><span><i style="background:var(--grid)"></i>ซื้อจากกริด (kWh/รอบ)</span>'
  +     '<span style="color:var(--muted)">แท่งประ = รอบที่ยังไม่จบ</span></div>'
  + '</div>'

  + '<div class="card">'
  +   '<h2>รอบนี้ประหยัดไปเท่าไหร่</h2>'
  +   '<div class="tiles c3">'
  +     tile("แดดใช้ตรง", f(c.self,1), "kWh", null, "gen")
  +     tile("ผ่านแบต", f(c.dis,1), "kWh", null, "good")
  +     tile("มูลค่า", "฿"+f(c.saved,0), "", "ถ้าซื้อไฟทั้งหมด", "good")
  +   '</div>'
  +   '<p class="note">🔴 "ประหยัด" = หน่วยที่ไม่ต้องซื้อ × ฿'+S.rate+
       ' — ยังไม่หักค่า Ft / ค่าบริการ / ขั้นบันไดอัตราก้าวหน้า ซึ่งบิลจริงมี</p>'
  + '</div>';
  return h;
}

/* ---------- 4d) ประวัติ (ทั้งคลัง) ---------- */
var RANGES = [{k:"30",l:"30 วัน"},{k:"90",l:"90 วัน"},{k:"month",l:"รายเดือน"},{k:"cycle",l:"รายรอบบิล"}];
function rangeBar(){
  return '<div class="seg-ctl">'+RANGES.map(function(r){
    return '<button data-range="'+r.k+'"'+(S.range===r.k?' class="on"':'')+'>'+r.l+'</button>';
  }).join("")+'</div>';
}
function viewHist(d){
  var all = d._days;
  if(!all.length) return '<div class="card"><div class="empty">ยังไม่มีข้อมูลรายวันในคลัง<br>'+
    'กด ⚙ → "ดึงย้อนหลังทั้งหมด" หรือเปิด <code>?f=diag</code> ดูว่า history ติดไหม</div></div>';

  var sd = (d.cycle||{}).startDay || 17;
  var B  = groupRows(all, S.range, d.today, sd);
  var daily = (S.range==="30"||S.range==="90");
  var done = B.filter(function(b){ return !b.partial; });
  var sum = function(k){ return done.reduce(function(a,b){ return a+(b[k]||0); },0); };
  var unit = daily?"วัน":(S.range==="month"?"เดือน":"รอบ");
  var avgGen = done.length ? sum("gen")/done.length : null;
  var best = done.reduce(function(a,b){ return (!a||(b.gen||0)>(a.gen||0))?b:a; }, null);
  var totUse = sum("use"), totImp = sum("imp");
  var ssAll = totUse>0 ? (totUse-totImp)/totUse*100 : null;     // ของทั้งงวด ไม่ใช่เฉลี่ยของเปอร์เซ็นต์

  // สถิติทั้งคลัง (ไม่ขึ้นกับช่วงที่เลือก)
  var allDone = all.filter(function(x){ return x.date!==d.today; });
  var allGen = allDone.reduce(function(a,b){ return a+(b.gen||0); },0);
  var allImp = allDone.reduce(function(a,b){ return a+(b.imp||0); },0);
  var allSelf= allDone.reduce(function(a,b){ return a+(b.self||0)+(b.dis||0); },0);

  var h = ''
  + '<div class="card">'
  +   '<h2>คลังข้อมูล<span class="badge">'+storeCount()+' วัน</span></h2>'
  +   '<p class="why">เก็บอยู่ในเครื่องนี้ ตั้งแต่ <b>'+esc(dLabel(storeMin()||"—"))+'</b> ถึง <b>'
  +     esc(dLabel(storeMax()||"—"))+'</b> · เปิดครั้งหน้าจะขอ server แค่วันที่ยังไม่มี</p>'
  +   '<div class="tiles c3">'
  +     tile("ผลิตสะสม", f(allGen,0), "kWh", null, "self")
  +     tile("ซื้อสะสม", f(allImp,0), "kWh", "฿"+f(allImp*S.rate,0), "cost")
  +     tile("ประหยัดสะสม", "฿"+f(allSelf*S.rate,0), "", f(allSelf,0)+" kWh", "good")
  +   '</div>'
  + '</div>'

  + '<div class="card">'
  +   '<h2>ช่วงที่ดู</h2>'
  +   rangeBar()
  +   '<div class="tiles" style="margin-top:11px">'
  +     tile("ผลิตรวม", f(sum("gen"),0), "kWh", "เฉลี่ย "+f(avgGen,1)+" /"+unit, "self")
  +     tile("ซื้อรวม", f(totImp,0), "kWh", "฿"+f(totImp*S.rate,0), "cost")
  +     tile((daily?"วัน":unit)+"ที่ดีที่สุด", best?f(best.gen,best.gen<100?1:0):"—", "kWh",
              best?(daily?dLabel(best.key):best.label):null, "gen")
  +     tile("พึ่งตัวเองทั้งงวด", ssAll===null?"—":f(ssAll,0), "%", "(ใช้-ซื้อ)÷ใช้ ของทั้งช่วง", "self")
  +   '</div>'
  +   '<p class="note">⧗ '+(daily?"วันนี้":"งวดที่ยังไม่จบ")+' ไม่ถูกนับในค่าเฉลี่ยและยอดรวมข้างบน '
  +     '(แท่งประในกราฟ) · "พึ่งตัวเองทั้งงวด" คำนวณจากยอดรวม ไม่ใช่เฉลี่ยของเปอร์เซ็นต์รายวัน</p>'
  + '</div>'

  + '<div class="card">'
  +   '<h2>ผลิตได้<span class="badge">'+B.length+' '+unit+'</span></h2>'
  +   '<div class="chart" id="cGen"></div>'
  +   '<div class="legend"><span><i style="background:var(--solar)"></i>ผลิต (kWh)</span>'
  +     '<span style="color:var(--muted)">- - เฉลี่ย '+f(avgGen,1)+'</span></div>'
  + '</div>'

  + '<div class="card">'
  +   '<h2>ไฟที่บ้านใช้ มาจากไหนบ้าง</h2>'
  +   '<p class="why">ความสูงของแท่ง = ที่ใช้ทั้งหมด — แถบแดงยิ่งบาง ยิ่งพึ่งกริดน้อย</p>'
  +   '<div class="chart" id="cSrc"></div>'
  +   '<div class="legend"><span><i style="background:var(--solar)"></i>แดด</span>'
  +     '<span><i style="background:var(--batt)"></i>แบต</span>'
  +     '<span><i style="background:var(--grid)"></i>กริด</span></div>'
  + '</div>'

  + '<div class="card">'

/* นับวันที่หายไประหว่างวันแรกกับวันล่าสุดที่เก็บไว้ */
function missingDays(){
  var a = storeMin(), b = storeMax(); if(!a||!b) return 0;
  var span = Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)+1;
  return Math.max(0, span - storeCount());
}

   5) render + charts
   =================================================================== */
function render(){
  var v = document.getElementById("view");
  if(S.tab==="cfg"){ v.innerHTML = viewCfg(); bindCfg(); return; }
  if(S.err){ v.innerHTML = '<div class="card"><h2>เชื่อมต่อไม่ได้</h2><p class="err">'+esc(S.err)+
    '</p><p class="note">เช็คที่ ⚙ ว่า URL ถูกไหม · หรือเปิด '+esc(S.api)+'?f=diag ในเบราว์เซอร์ดูตรง ๆ</p></div>'; return; }
  if(!S.d){ v.innerHTML = '<div class="card"><div class="skel" style="width:60%"></div>'+
    '<div class="skel" style="width:90%;margin-top:9px"></div>'+
    '<div class="skel" style="height:110px;margin-top:14px"></div></div>'; return; }
  var d = S.d;
  if(S.tab==="now")  v.innerHTML = viewNow(d);
  if(S.tab==="day"){ v.innerHTML = viewDay(d); drawDay(d); }
  if(S.tab==="cyc"){ v.innerHTML = viewCycle(d); drawCycle(d); }
  if(S.tab==="hist"){ v.innerHTML = viewHist(d); drawHist(d); }
}
var XT = [{v:0,l:"00"},{v:360,l:"06"},{v:720,l:"12"},{v:1080,l:"18"},{v:1440,l:"24"}];

function drawDay(d){
  var it = d._intra;
  var p = chartHost("cPow");
  if(p) timeSeries(p, { x:it.t, h:160, xMin:0, xMax:1440, xTicks:XT,
    series:[ {name:"แดดผลิต", color:cssv("--solar"), vals:it.pv, area:true},
             {name:"บ้านใช้",  color:cssv("--home"),  vals:it.load, area:false} ],
    yFmt:function(v){ return v>=1000? (v/1000).toFixed(1)+"k" : f(v); },
    vFmt:function(v){ return f(v)+" W"; },
    xLabel:hhmm, empty:"ยังไม่มีข้อมูลราย 5 นาทีของวันนี้" });
  var s = chartHost("cSoc");
  if(s) timeSeries(s, { x:it.t, h:120, xMin:0, xMax:1440, xTicks:XT, yMax:100,
    yTicks:[0,50,100],
    series:[ {name:"แบต", color:cssv("--batt"), vals:it.soc, area:true} ],
    yFmt:function(v){ return f(v)+"%"; }, vFmt:function(v){ return f(v,1)+"%"; },
    xLabel:hhmm, empty:"ยังไม่มีข้อมูล SOC ของวันนี้" });
}
function drawCycle(d){
  var c = d._cyc, host = chartHost("cCyc");
  if(host && c){
    var idx = c.rows.map(function(x){ return x.date; }).indexOf(d.today);
    bars(host, { labels:c.rows.map(function(x){ return dLabel(x.date); }), h:150, unit:" kWh",
      series:[{name:"ซื้อจากกริด", color:cssv("--grid"), vals:c.rows.map(function(x){ return x.imp; })}],
      partialIdx: idx, refLine:c.avgImp, refLabel:"เฉลี่ย "+f(c.avgImp,1),
      tipLabel:function(i){ return dLabel(c.rows[i].date); } });
  }
  // ทุกรอบบิลที่มีในคลัง
  var all = chartHost("cCycAll"); if(!all) return;
  var sd = (d.cycle||{}).startDay || 17;
  var B = groupRows(d._days, "cycle", d.today, sd);
  var badge = document.getElementById("cycN");
  if(badge) badge.textContent = B.length+" รอบ";
  if(!B.length){ all.innerHTML = '<div class="empty">ยังไม่มีข้อมูลย้อนหลัง</div>'; return; }
  var idx2 = B.reduce(function(a,b,i){ return b.partial?i:a; }, -1);
  var doneB = B.filter(function(b){ return !b.partial && b.nDays>=25; });   // รอบที่เก็บได้ไม่ครบ ไม่เอามาหาร
  var avg = doneB.length ? doneB.reduce(function(a,b){ return a+b.imp; },0)/doneB.length : null;
  bars(all, { labels:B.map(function(b){ return b.label; }), h:160, unit:" kWh", partialIdx:idx2, maxBar:30,
    series:[{name:"ซื้อจากกริด", color:cssv("--grid"), vals:B.map(function(b){ return b.imp; })}],
    refLine:avg, refLabel:avg===null?"":"เฉลี่ย "+f(avg,0),
    tipLabel:function(i){ return B[i].label+" · "+B[i].nDays+" วัน"+
      (B[i].nDays<25?" (ข้อมูลไม่ครบรอบ)":"")+" · ฿"+f(B[i].cost,0); } });
}
function drawHist(d){
  var sd = (d.cycle||{}).startDay || 17;
  var B = groupRows(d._days, S.range, d.today, sd);
  var daily = (S.range==="30"||S.range==="90");
  var labs = B.map(function(b){ return daily ? dLabel(b.key) : b.label; });
  var idx  = B.reduce(function(a,b,i){ return b.partial?i:a; }, -1);
  var done = B.filter(function(b){ return !b.partial; });
  var avgGen = done.length? done.reduce(function(a,b){ return a+(b.gen||0); },0)/done.length : null;
  var tip = function(i){ return daily ? dLabel(B[i].key)
                                      : B[i].label+" ("+B[i].nDays+" วัน)"; };

  var g = chartHost("cGen");
  if(g) bars(g, { labels:labs, h:150, unit:" kWh", partialIdx:idx,
    series:[{name:"ผลิต", color:cssv("--solar"), vals:B.map(function(b){ return b.gen; })}],
    refLine:avgGen, refLabel:"เฉลี่ย "+f(avgGen,1), tipLabel:tip });

  var s = chartHost("cSrc");
  if(s) bars(s, { labels:labs, h:150, stacked:true, unit:" kWh", partialIdx:idx,
    series:[ {name:"แดด", color:cssv("--solar"), vals:B.map(function(b){ return b.self; })},
             {name:"แบต", color:cssv("--batt"),  vals:B.map(function(b){ return b.dis; })},
             {name:"กริด",color:cssv("--grid"),  vals:B.map(function(b){ return b.imp; })} ],
    tipLabel:tip });

  var m = chartHost("cMoney");
  if(m) bars(m, { labels:labs, h:150, unit:" ฿", partialIdx:idx, maxBar:30,
    series:[ {name:"จ่ายจริง",  color:cssv("--grid"), vals:B.map(function(b){ return b.cost; })},
             {name:"ประหยัดได้", color:cssv("--batt"), vals:B.map(function(b){ return b.saved; })} ],
    tipLabel:tip });

  document.querySelectorAll("[data-range]").forEach(function(b){
    b.onclick = function(){ S.range = b.getAttribute("data-range"); save("range", S.range);
      window.scrollTo(0,0); render(); };
  });
  var csv = document.getElementById("btnCsv");
  if(csv) csv.onclick = exportCsv;
}
function exportCsv(){
  var rows = [["date","gen_kwh","use_kwh","import_kwh","export_kwh","charge_kwh","discharge_kwh"]]
    .concat(storeRows().map(function(r){ return r.map(function(v){ return v===null?"":v; }); }));
  var blob = new Blob(["﻿"+rows.map(function(r){ return r.join(","); }).join("\n")],
                      {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "deye-daily-"+(storeMin()||"")+"_"+(storeMax()||"")+".csv";
  a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

/* ===================================================================
   6) load / events
   =================================================================== */
/* โหลด: ขอจาก server เฉพาะวันที่เครื่องนี้ยังไม่มี แล้ว merge เข้าคลัง
   forceFull=true -> ขอใหม่ทั้งหมด (ปุ่ม "ดึงย้อนหลังทั้งหมด" ใน ⚙) */
function load(forceFull){
  var since = forceFull ? null : storeMax();
  var url = S.api + "?f=json"
          + (since ? "&since="+since : "")
          + (S.key ? "&key="+encodeURIComponent(S.key) : "")
          + "&_=" + Date.now();
  var st = document.getElementById("stamp");
  // 2026-09-22 ระหว่างรอ ห้ามล้างค่าที่วาดอยู่ — บอกแค่ว่ากำลังอัปเดต + ค่าที่เห็นเก่าแค่ไหน
  st.innerHTML = (since ? "กำลังอัปเดต…" : "กำลังดึงย้อนหลังทั้งหมด…")
    + (S.stale ? '<br><span style="color:var(--muted)">ค่าที่เห็นเมื่อ '
        + new Date(S.stale).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})
        + '</span>' : "");

  // หน้าที่ GAS เสิร์ฟเองอยู่ใน iframe คนละ origin -> fetch ติด CORS
  // ใช้ google.script.run แทน (ช่องทางของ Apps Script เอง) ถ้าไม่มีค่อย fetch ตามปกติ
  if (window.google && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(j){ onData(j, since); })
      .withFailureHandler(function(e){ onFail(e, st); })
      .getPayload(since || "", S.key || "");
    return;
  }
  fetch(url).then(function(r){ return r.json(); }).then(function(j){ onData(j, since); })
    .catch(function(e){ onFail(e, st); });
}

/* เส้นเบา — ขอเฉพาะค่ากำลังไฟตอนนี้ (server ใช้ latest_() อย่างเดียว ไม่ลาก days_/intraday_)
   2026-09-22 เพิ่มเพราะ ?f=json ก้อนเดียวใช้เวลา >38.9 วิ ทำให้การ์ด Battery ว่างทั้งแถบระหว่างรอ
   🔵 ล้มก็เงียบ ไม่ต้องแจ้ง — ก้อนใหญ่ที่ยิงคู่กันอยู่จะมาทับให้เองอยู่แล้ว */
function loadNow(){
  var ok = function(j){ applyNow(j); }, no = function(){};
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(no).getBatteryData();
    return;
  }
  fetch(S.api + "?f=now" + (S.key ? "&key="+encodeURIComponent(S.key) : "") + "&_=" + Date.now())
    .then(function(r){ return r.json(); }).then(ok).catch(no);
}

/* รับได้ 2 ทรง: {ok,now:{...}} จาก ?f=now · {ok,soc,batt,gen,cons} จาก getBatteryData() */
function applyNow(j){
  if(!j || !j.ok || !S.d) return;
  var n = j.now || { soc:j.soc, batt:j.batt, pv:j.gen, load:j.cons, grid:null };
  if(n.soc===undefined && n.pv===undefined) return;
  S.d.now = n;
  S.stale = null;                                  // ค่าสดแล้ว เอาป้าย "ค่าเมื่อ…" ออก
  try{ S.d = derive({ ok:true, ts:(j.ts||Date.now()),
                      today:new Date().toISOString().slice(0,10),
                      now:n, days:storeRows(),
                      intraday:(S.d.intraday||{t:[],pv:[],load:[],soc:[],grid:[]}),
                      cycle:(S.d.cycle||guessCycle()), meta:(S.d.meta||{}) }); }catch(e){}
  render();
}

/* แคปซูลสถานะ — ที่เดียวที่ประกอบป้าย Online/Offline ให้ทุกที่เรียกใช้ตรงกัน
   on   = ต่อ server ได้ · ตัวเลขบนจอมาจากรอบนี้
   off  = ต่อไม่ได้ · กำลังแสดงของเก่าจากคลังในเครื่อง
   wait = ยังไม่รู้ผล (กำลังโหลด) — 🔴 ห้ามขึ้น Online ก่อนได้ข้อมูลจริง เดี๋ยวโกหก */
function spill(state, text){
  return '<span class="spill '+state+'"><i></i>'+text+'</span>';
}

function onData(j, since){
  var st = document.getElementById("stamp");
  (function(){
    if(!j || !j.ok){ onFail((j&&j.err)||"API ตอบ ok=false"); return; }
    var m = storeMerge(j.days);
    S.sync = { got:(j.days||[]).length, added:m.added, updated:m.updated, since:since, full:!!j.full };
    j.days = storeRows();                     // ทุกหน้าอ่านจากคลังในเครื่อง ไม่ใช่จาก response
    snapSave(j);                              // 2026-09-22 จำ now+intraday ไว้ให้รอบเปิดถัดไปวาดทันที
    S.stale = null;
    S.d = derive(j); S.err = null;
    var w = (j.meta&&j.meta.warn)||[];
    st.innerHTML =
      spill("on","Online")+"<br>"+
      "อัปเดต "+new Date(j.ts).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+
      "<br>คลัง "+storeCount()+" วัน"+(m.added?' · <b style="color:var(--good)">+'+m.added+' ใหม่</b>':'')+
      (w.length? '<br><span style="color:var(--warn)">⚠ '+w.length+' warning</span>':'');
    render(); fillDiag();
  })();
}

function onFail(e, st){
  st = st || document.getElementById("stamp");
  (function(){
    // ต่อ server ไม่ได้ ยังเปิดดูของเก่าในคลังได้ — บอกให้ชัดว่านี่คือข้อมูลค้าง
    var sn = snapLoad();                      // 2026-09-22 ต่อเน็ตไม่ได้ ก็ยังวาดค่าล่าสุดที่จำไว้ได้
    if(storeCount() || sn){
      S.stale = sn ? sn.ts : null;
      S.d = derive({ ok:true, ts:(sn?sn.ts:Date.now()), today:new Date().toISOString().slice(0,10),
                     now:(sn?sn.now:{}), days:storeRows(),
                     intraday:(sn&&sn.intraday)?sn.intraday:{t:[],pv:[],load:[],soc:[],grid:[]},
                     cycle:guessCycle(), meta:{warn:["offline: "+e]} });
      S.err = null; S.offline = String(e);
      st.innerHTML = spill("off","Offline")+'<br>แสดงจากคลังในเครื่อง<br>'+storeCount()+' วัน';
    } else {
      S.err = String(e); st.textContent = "โหลดไม่สำเร็จ";
      // 🔴 เครื่องที่ไม่เคยเปิด V3 มาก่อนจะไม่มี key เก็บไว้ ⇒ getPayload โยน "bad key"
      // หน้าเปล่า + คำว่า "โหลดไม่สำเร็จ" ทำอะไรต่อไม่ได้ — ต้องมีทางกลับหน้าเดิมในคลิกเดียว
      // (เพิ่ม 2026-09-22 ตอนเอา V3 ไปทับ @11 ที่คนในบ้านใช้)
      if(/bad key|ไม่มีสิทธิ|unauthor/i.test(String(e))){
        st.innerHTML = '<span style="color:var(--crit)">เปิดไม่ได้ — ยังไม่ได้ใส่รหัส</span>'
          + '<br><a href="?p=v2" style="color:var(--home)">กลับไปหน้าเดิม</a>'
          + ' · <a href="#" onclick="document.getElementById(\'btnCfg\').click();return false"'
          + ' style="color:var(--home)">ใส่รหัสที่ ⚙</a>';
      }
    }
    render();
  })();
}
/* รอบบิลฝั่ง client (ใช้ตอนออฟไลน์เท่านั้น — ปกติ server เป็นคนบอก) */
function guessCycle(){
  var sd = 17, t = new Date(), y=t.getFullYear(), m=t.getMonth(), d=t.getDate();
  var s = (d>=sd) ? new Date(y,m,sd) : new Date(y,m-1,sd);
  var f = function(x){ return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2); };
  return { start:f(s), end:f(new Date(s.getFullYear(),s.getMonth()+1,sd-1)),
           prevStart:f(new Date(s.getFullYear(),s.getMonth()-1,sd)),
           prevEnd:f(new Date(s.getFullYear(),s.getMonth(),sd-1)), startDay:sd };
}

    "<br>วิธีที่ยิง history ติด: intraday=<b>"+esc(m.intradayHow||"?")+"</b> · daily=<b>"+esc(m.daysHow||"?")+"</b>"+
    "<br>ฝั่ง server มี "+esc(m.archiveDays||0)+" วัน ("+esc(m.archiveFirst||"—")+" → "+esc(m.archiveLast||"—")+")"+
    "<br>รอบล่าสุดขอไป since=<b>"+esc(s.since||"(ทั้งหมด)")+"</b> ได้ "+(s.got||0)+" วัน · ใหม่ "+(s.added||0)+
    "<br>คลังในเครื่อง "+storeCount()+" วัน · จุดราย 5 นาทีวันนี้ "+(S.d.intraday.t||[]).length+
    "<br>รอบบิล: "+esc((S.d.cycle||{}).start)+" → "+esc((S.d.cycle||{}).end)+

}
function bindCfg(){
  var out = document.getElementById("syncOut");
  document.getElementById("btnSave").onclick = function(){
    save("rate", document.getElementById("inRate").value||"4.40");
    save("cap",  document.getElementById("inCap").value||"0");
    save("api",  document.getElementById("inApi").value.trim()||DEFAULT_API);
    save("key",  document.getElementById("inKey").value.trim());
    location.reload();
  };
  document.getElementById("btnFull").onclick = function(){
    out.textContent = "กำลังดึงทั้งหมด…"; load(true);
    setTimeout(function(){ if(S.sync) out.innerHTML =
      "ได้ "+S.sync.got+" วันจาก server · เพิ่มใหม่ "+S.sync.added+" · ทับของเดิม "+S.sync.updated+
      "<br>คลังตอนนี้ "+storeCount()+" วัน"; }, 2500);
  };
  document.getElementById("btnSync").onclick = function(){
    out.textContent = "สั่ง server ไปถาม Deye… (ย้อนหลังเยอะอาจใช้เวลาเป็นนาที)";
    fetch(S.api+"?f=sync"+(S.key?"&key="+encodeURIComponent(S.key):"")+"&_="+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        out.innerHTML = j.ok
          ? "server: ช่วง "+esc(j.from)+" → "+esc(j.to)+" · เพิ่ม <b>"+j.added+"</b> วัน · แก้ "+j.updated+
            " · คลังฝั่ง server "+j.total+" วัน<br>กด \"ดึงย้อนหลังทั้งหมดใหม่\" เพื่อเอาลงเครื่อง"
          : '<span style="color:var(--crit)">'+esc(j.err||"sync ไม่สำเร็จ")+'</span>';
      })
      .catch(function(e){ out.innerHTML = '<span style="color:var(--crit)">'+esc(String(e))+'</span>'; });
  };
  document.getElementById("btnWipe").onclick = function(){
    if(!confirm("ล้างข้อมูลย้อนหลังในเครื่องนี้ทั้งหมด? (ของบน server ไม่ถูกแตะ)")) return;
    try{ localStorage.removeItem("solar3_days"); }catch(e){}
    STORE.map = {}; out.textContent = "ล้างแล้ว"; load(true);
  };
  fillDiag();
}

};
document.getElementById("btnTheme").onclick = function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : (cur==="light" ? "" : "dark");
  if(next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  save("theme", next); render();
};
